name: Auto Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy to Render
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_URL }}" -H "Content-Type: application/json"

  build-mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Build DMGs
        run: bash scripts/build-dmg.sh
      - name: Commit DMGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/BlockForge-mac-arm64.dmg downloads/BlockForge-mac-x64.dmg
          git commit -m "rebuild macOS .dmg downloads" || echo "no changes"
          for i in 1 2 3; do git push && break; sleep 5; git pull --rebase --autostash; done

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK licenses + platform 36
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" > /dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Stage APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/BlockForge-android.apk
      - name: Commit APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/BlockForge-android.apk
          git commit -m "rebuild Android .apk download" || echo "no changes"
          for i in 1 2 3; do git push && break; sleep 5; git pull --rebase --autostash; done

  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p /tmp/ipa/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app /tmp/ipa/Payload/BlockForge.app
          cd /tmp/ipa
          zip -r -y "$OLDPWD/downloads/BlockForge-iphone-ipa.ipa" Payload
      - name: Commit IPA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/BlockForge-iphone-ipa.ipa
          git commit -m "rebuild iOS .ipa download" || echo "no changes"
          for i in 1 2 3; do git push && break; sleep 5; git pull --rebase --autostash; done

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Build portable EXE
        run: npx electron-builder --win portable
      - name: Stage EXE
        run: |
          mkdir downloads -Force
          Copy-Item release/BlockForge-windows.exe downloads/BlockForge-windows.exe
      - name: Commit EXE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f downloads/BlockForge-windows.exe
          git commit -m "rebuild Windows .exe download" || echo "no changes"
          for i in 1 2 3; do git push && break; sleep 5; git pull --rebase --autostash; done

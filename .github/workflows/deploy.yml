name: Auto Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy to Render
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_URL }}" -H "Content-Type: application/json"

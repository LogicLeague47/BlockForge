name: Auto Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy to Render
        run: |
          URL="${RENDER_DEPLOY_URL:-https://api.render.com/deploy/srv-d9aa3v6cjfls739gj3rg?key=62rFnWWb5YM}"
          curl -s -X POST "$URL" -H "Content-Type: application/json" || true

  build-mac-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build Mac DMGs (arm64 + x64)
        run: |
          npx electron-builder --mac dmg --arm64
          npx electron-builder --mac dmg --x64
      - name: Upload DMGs to GitHub Release
        run: |
          gh release create binaries --title "BlockForge Downloads" --notes "Latest binaries built by CI" || true
          gh release upload binaries release/BlockForge-mac-arm64.dmg release/BlockForge-mac-x64.dmg --clobber

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Upload APK to GitHub Release
        run: |
          gh release create binaries --title "BlockForge Downloads" --notes "Latest binaries built by CI" || true
          gh release upload binaries android/app/build/outputs/apk/debug/app-debug.apk --clobber

  build-ios-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p /tmp/ipa/Payload downloads
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app /tmp/ipa/Payload/BlockForge.app
          cd /tmp/ipa
          zip -r -y "$OLDPWD/downloads/BlockForge-iphone-ipa.ipa" Payload
      - name: Upload IPA to GitHub Release
        run: |
          gh release create binaries --title "BlockForge Downloads" --notes "Latest binaries built by CI" || true
          gh release upload binaries downloads/BlockForge-iphone-ipa.ipa --clobber

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build portable EXE
        run: npx electron-builder --win portable
      - name: Upload EXE to GitHub Release
        run: |
          gh release create binaries --title "BlockForge Downloads" --notes "Latest binaries built by CI" || true
          gh release upload binaries release/BlockForge-windows.exe --clobber

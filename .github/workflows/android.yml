name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockForge-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "Android APK (build ${{ github.run_number }})"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
          body: "Auto-built Android APK from commit ${{ github.sha }}"
          make_latest: false

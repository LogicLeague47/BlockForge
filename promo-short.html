<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockForge - YouTube Short</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }

#canvas {
  width: min(100vw, 56.25vh);
  height: min(177.78vw, 100vh);
  background: #1a1a2e;
  position: relative;
  overflow: hidden;
}

.scene {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  opacity: 0; pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.scene.active { opacity: 1; pointer-events: auto; }

.game-bg {
  position: absolute; inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.game-bg .sky {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, #4a90d9 0%, #87ceeb 50%, #b8dff0 100%);
}
.game-bg .sky-sunset {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, #1a1a3e 0%, #d4764a 30%, #f4a460 50%, #87ceeb 70%, #b8dff0 100%);
}
.game-bg .sky-night {
  position: absolute; top: 0; left: 0; right: 0; height: 60%;
  background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3e 40%, #2a2a4e 100%);
}

.game-bg .sun {
  position: absolute; width: 40px; height: 40px;
  background: #ffe066; border-radius: 50%;
  box-shadow: 0 0 60px #ffe06666;
}
.game-bg .sun-sunset {
  position: absolute; width: 50px; height: 50px;
  background: #f4a460; border-radius: 50%;
  box-shadow: 0 0 80px #f4a46088;
}
.game-bg .moon {
  position: absolute; width: 32px; height: 32px;
  background: #ccd; border-radius: 50%;
  box-shadow: 0 0 40px rgba(200,200,220,0.3);
}

.game-bg .cloud {
  position: absolute; display: flex; gap: 1px; opacity: 0.7;
}
.game-bg .cloud div {
  width: 18px; height: 10px;
  background: rgba(255,255,255,0.8); border-radius: 5px;
}

.terrain-wrap {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center; z-index: 1;
}

.promo-text {
  font-weight: 800; text-align: center; color: #fff;
  padding: 0 24px; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  position: relative; z-index: 2; white-space: pre-line;
}
.promo-text span { color: #5af; }
.promo-sub {
  font-weight: 600; text-align: center;
  color: rgba(255,255,255,0.85); padding: 0 24px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  position: relative; z-index: 2; white-space: pre-line;
}

#scene-1 .overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 50%, rgba(0,0,0,0.3) 100%);
  z-index: 1;
}

#scene-2 .overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.25); z-index: 1;
}
#scene-2 .scene-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; width: 100%;
}

#scene-3 .overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: 1;
}
#scene-3 .scene-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; width: 100%;
}
.feature-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: clamp(6px, 1.2vw, 12px); padding: 16px;
  max-width: 480px; width: 100%;
}
.feature-card {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
  padding: clamp(8px, 1.5vw, 16px); text-align: center;
  transform: translateY(12px); opacity: 0;
  transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.feature-card.show { transform: translateY(0); opacity: 1; }
.feature-card .icon { font-size: clamp(24px, 4vw, 40px); margin-bottom: 4px; }
.feature-card .label { font-size: clamp(9px, 1.6vw, 14px); font-weight: 700; color: #fff; }
.feature-card .desc { font-size: clamp(7px, 1.2vw, 11px); color: #99aabb; margin-top: 2px; }

#scene-4 .overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, rgba(20,10,5,0.3) 40%, rgba(0,0,0,0.2) 100%);
  z-index: 1;
}
#scene-4 .scene-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; width: 100%;
}

#scene-5 .overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.6) 100%);
  z-index: 1;
}
#scene-5 .scene-content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
}
.cta-card {
  background: rgba(8,8,20,0.55); backdrop-filter: blur(12px);
  border: 1px solid rgba(100,140,255,0.1); border-radius: 16px;
  padding: clamp(20px, 3vw, 32px) clamp(24px, 4vw, 40px);
  text-align: center; max-width: 440px; width: 90%;
  box-shadow: 0 16px 48px rgba(0,0,0,0.4);
}
.cta-title {
  font-size: clamp(24px, 4vw, 42px); font-weight: 900;
  background: linear-gradient(135deg, #e0e8ff 0%, #8af 50%, #c084fc 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1.2;
}
.cta-url {
  font-size: clamp(16px, 2.5vw, 24px); font-weight: 700; color: #8af;
  margin-top: 16px; padding: 10px 24px;
  border: 1px solid rgba(100,150,255,0.2); border-radius: 12px;
  background: rgba(0,0,0,0.3); display: inline-block;
}
.cta-sub {
  font-size: clamp(12px, 2vw, 16px); color: #99aabb;
  margin-top: 16px; line-height: 1.5;
}

.star {
  position: absolute; width: 2px; height: 2px;
  background: #fff; border-radius: 50%;
  animation: twinkle 2s ease-in-out infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 1; } }
@keyframes drift { 0% { transform: translateX(-100px); } 100% { transform: translateX(calc(100vw + 100px)); } }

#progress {
  position: absolute; bottom: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, #5af, #a7f);
  width: 0; z-index: 100;
}
#skip-btn {
  position: absolute; bottom: 16px; right: 16px; z-index: 99;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #889; padding: 6px 14px; border-radius: 6px;
  font-size: 12px; cursor: pointer;
}
#skip-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
</style>
</head>
<body>

<div id="canvas">
  <!-- Scene 1: Hook (0–8s) -->
  <div id="scene-1" class="scene active">
    <div class="game-bg">
      <div class="sky"></div>
      <div class="sun" style="top:12%;right:25%;"></div>
      <div class="cloud" style="top:8%;left:15%;animation:drift 20s linear infinite;"><div></div><div></div><div></div><div></div></div>
      <div class="cloud" style="top:18%;left:60%;animation:drift 25s linear infinite;"><div></div><div></div><div></div></div>
    </div>
    <div class="overlay"></div>
    <div id="terrain-1" class="terrain-wrap"></div>
    <div class="promo-text" style="font-size:clamp(22px,4vw,42px);line-height:1.3;" id="hook-text"></div>
    <div class="promo-sub" style="font-size:clamp(14px,2.5vw,24px);margin-top:20px;" id="hook-sub"></div>
  </div>

  <!-- Scene 2: Showcase (8–24s) -->
  <div id="scene-2" class="scene">
    <div class="game-bg">
      <div class="sky"></div>
      <div class="cloud" style="top:10%;left:20%;animation:drift 18s linear infinite;"><div></div><div></div><div></div><div></div></div>
      <div class="cloud" style="top:22%;left:55%;animation:drift 24s linear infinite;"><div></div><div></div><div></div></div>
    </div>
    <div class="overlay"></div>
    <div id="terrain-2" class="terrain-wrap"></div>
    <div class="scene-content">
      <div class="promo-text" style="font-size:clamp(18px,3.5vw,36px);line-height:1.3;" id="showcase-text"></div>
      <div class="promo-sub" style="font-size:clamp(12px,2vw,18px);margin-top:16px;" id="showcase-sub"></div>
    </div>
  </div>

  <!-- Scene 3: Features (24–44s) -->
  <div id="scene-3" class="scene">
    <div class="game-bg">
      <div class="sky"></div>
      <div class="cloud" style="top:10%;left:30%;animation:drift 22s linear infinite;"><div></div><div></div><div></div></div>
    </div>
    <div class="overlay"></div>
    <div id="terrain-3" class="terrain-wrap"></div>
    <div class="scene-content">
      <div class="promo-text" style="font-size:clamp(14px,2.5vw,22px);margin-bottom:8px;">WHAT IS BLOCKFORGE?</div>
      <div class="feature-grid" id="feature-grid"></div>
    </div>
  </div>

  <!-- Scene 4: Sunset (44–53s) -->
  <div id="scene-4" class="scene">
    <div class="game-bg">
      <div class="sky-sunset"></div>
      <div class="sun-sunset" style="bottom:42%;left:50%;transform:translateX(-50%);"></div>
    </div>
    <div class="overlay"></div>
    <div id="terrain-4" class="terrain-wrap"></div>
    <div class="scene-content">
      <div class="promo-text" style="font-size:clamp(16px,3vw,30px);line-height:1.4;" id="sunset-text"></div>
      <div class="promo-sub" style="font-size:clamp(12px,2vw,18px);margin-top:16px;" id="sunset-sub"></div>
    </div>
  </div>

  <!-- Scene 5: CTA (53–60s) -->
  <div id="scene-5" class="scene">
    <div class="game-bg" id="scene5-bg">
      <div class="sky-night"></div>
      <div class="moon" style="top:15%;left:65%;"></div>
    </div>
    <div class="overlay"></div>
    <div id="terrain-5" class="terrain-wrap"></div>
    <div class="scene-content">
      <div class="cta-card">
        <div class="cta-title">Ready to build?</div>
        <div class="cta-url">blockforge-1.onrender.com</div>
        <div class="cta-sub">Free &bull; No download &bull; In your browser</div>
      </div>
    </div>
  </div>

  <div id="progress"></div>
  <button id="skip-btn">SKIP ›</button>
</div>

<script>
var TOTAL_DURATION = 60;
var SCENES = [
  { id: 'scene-1', start: 0, end: 8 },
  { id: 'scene-2', start: 8, end: 24 },
  { id: 'scene-3', start: 24, end: 44 },
  { id: 'scene-4', start: 44, end: 53 },
  { id: 'scene-5', start: 53, end: 60 }
];

var FEATURES = [
  { icon: '⛏️', label: 'Survival Mode', desc: 'Mine, craft, fight, explore' },
  { icon: '🌍', label: 'Multiplayer', desc: 'Play with friends, voice chat' },
  { icon: '🎨', label: 'Custom Skins', desc: 'Built-in pixel editor' },
  { icon: '⚡', label: 'Greenstone', desc: 'Redstone-style circuits' },
  { icon: '🌦️', label: 'Dynamic Weather', desc: 'Rain, snow, thunderstorms' },
  { icon: '🏔️', label: '14 Biomes', desc: 'Oceans to mountains' },
  { icon: '🏃', label: 'Parkour', desc: '10 built-in levels' },
  { icon: '🎮', label: 'Free & Online', desc: 'No download needed' }
];

// ═══ SOUND ENGINE ═══
var _actx = null;
function ctx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}

function tone(freq, dur, type, vol) {
  try {
    var c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(vol || 0.1, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch(e) {}
}

function noise(dur, filterFreq, vol) {
  try {
    var c = ctx(), sz = c.sampleRate * dur;
    var buf = c.createBuffer(1, sz, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
    var src = c.createBufferSource();
    src.buffer = buf;
    var f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = filterFreq || 800;
    var g = c.createGain();
    g.gain.setValueAtTime(vol || 0.06, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(); src.stop(c.currentTime + dur);
  } catch(e) {}
}

function sfxClick() { tone(900, 0.04, 'square', 0.03); }
function sfxWhoosh() { tone(300, 0.3, 'sine', 0.08); setTimeout(function(){ tone(150, 0.2, 'sine', 0.05); }, 80); }
function sfxPop() { tone(600, 0.08, 'sine', 0.07); tone(900, 0.06, 'sine', 0.04); }
function sfxBlock() { tone(200, 0.1, 'square', 0.06); noise(0.08, 600, 0.04); }
function sfxReveal() { tone(400, 0.4, 'sine', 0.06); setTimeout(function(){ tone(600, 0.3, 'sine', 0.05); }, 150); }
function sfxResolve() { tone(262, 0.8, 'sine', 0.06); setTimeout(function(){ tone(330, 0.7, 'sine', 0.05); }, 100); setTimeout(function(){ tone(392, 0.6, 'sine', 0.05); }, 200); }
function sfxChirp() { tone(2500 + Math.random() * 2000, 0.08, 'sine', 0.015); }

var _windTimer = null;
function startWind() {
  if (_windTimer) return;
  noise(2.5, 400, 0.015);
  _windTimer = setInterval(function() { noise(2.5, 400, 0.015); }, 2500);
}
function stopWind() { if (_windTimer) { clearInterval(_windTimer); _windTimer = null; } }

// ═══ TERRAIN ═══
function buildTerrain(container, cols, heights, layers) {
  var wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:0;align-items:flex-end;';
  for (var c = 0; c < cols; c++) {
    var h = heights[c];
    var col = document.createElement('div');
    col.style.cssText = 'display:flex;flex-direction:column-reverse;';
    for (var ly = 0; ly < h; ly++) {
      var b = document.createElement('div');
      b.style.cssText = 'width:16px;height:16px;flex-shrink:0;background:' + (layers[c][ly] || '#000') + ';';
      col.appendChild(b);
    }
    wrap.appendChild(col);
  }
  container.appendChild(wrap);
}

function buildSceneTerrain(id, opts) {
  var tw = document.getElementById(id);
  if (!tw) return;
  var COLS = opts.cols || 30;
  var cols = [], lay = [];
  var dirt = opts.dirt || '#866043';
  var grass = opts.grass || '#5daa34';
  var stone = opts.stone || '#888888';
  var bedrock = opts.bedrock || '#555555';
  for (var c = 0; c < COLS; c++) {
    var dx = c - COLS / 2;
    var base = Math.max(1, (opts.baseHeight || 5) - Math.abs(dx) * (opts.falloff || 0.15));
    var h = Math.floor(base + Math.sin(dx * (opts.freq || 0.8)) * (opts.amp || 0.6) + Math.sin(dx * (opts.freq2 || 0.3)) * (opts.amp2 || 0.4));
    cols.push(h + 2);
    var l = [bedrock];
    for (var s = 0; s < h - 1; s++) l.push(stone);
    l.push(dirt); l.push(grass);
    lay.push(l);
  }
  buildTerrain(tw, COLS, cols, lay);
}

function buildStars() {
  var bg = document.getElementById('scene5-bg');
  if (!bg) return;
  for (var i = 0; i < 50; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 55 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
    bg.appendChild(s);
  }
}

try {
  buildSceneTerrain('terrain-1', { cols: 28, baseHeight: 5, falloff: 0.15, freq: 0.8, amp: 0.6, freq2: 0.3, amp2: 0.4 });
  buildSceneTerrain('terrain-2', { cols: 28, baseHeight: 5, falloff: 0.14, freq: 0.9, amp: 0.5, freq2: 0.3, amp2: 0.3, grass: '#6aba3a' });
  buildSceneTerrain('terrain-3', { cols: 24, baseHeight: 4, falloff: 0.12, freq: 1.0, amp: 0.5, freq2: 0.4, amp2: 0.3, grass: '#6aba3a' });
  buildSceneTerrain('terrain-4', { cols: 28, baseHeight: 5, falloff: 0.18, freq: 0.7, amp: 0.5, freq2: 0.3, amp2: 0.3, stone: '#5a5040', grass: '#c08840' });
  buildSceneTerrain('terrain-5', { cols: 28, baseHeight: 5, falloff: 0.2, freq: 1.2, amp: 0.4, freq2: 0.3, amp2: 0.3, stone: '#4A5A6A', grass: '#4a7a3a' });
  buildStars();
} catch(e) { console.warn('[Promo] terrain error:', e); }

try {
  var grid = document.getElementById('feature-grid');
  if (grid) FEATURES.forEach(function(f) {
    var card = document.createElement('div');
    card.className = 'feature-card';
    card.innerHTML = '<div class="icon">' + f.icon + '</div><div class="label">' + f.label + '</div><div class="desc">' + f.desc + '</div>';
    grid.appendChild(card);
  });
} catch(e) { console.warn('[Promo] grid error:', e); }

// ═══ TYPEWRITER ═══
var _twFrame = null;
function cancelTypewriter() {
  if (_twFrame) { cancelAnimationFrame(_twFrame); _twFrame = null; }
}

function typeWriter(el, text, msPerChar, callback) {
  cancelTypewriter();
  if (!el) { if (callback) callback(); return; }
  el.innerHTML = '';
  var chars = text.split('');
  var shown = 0, buf = '', last = 0;
  function frame(ts) {
    if (!last) last = ts;
    var dt = ts - last;
    while (dt >= msPerChar && shown < chars.length) {
      var ch = chars[shown++];
      buf += ch === '\n' ? '<br>' : ch;
      dt -= msPerChar;
      last = ts;
    }
    el.innerHTML = buf;
    if (shown < chars.length) {
      _twFrame = requestAnimationFrame(frame);
    } else {
      _twFrame = null;
      if (callback) callback();
    }
  }
  _twFrame = requestAnimationFrame(frame);
}

// ═══ SCENE MANAGEMENT ═══
var currentSceneIdx = -1;
var startTime = null;
var animId = null;
var skipped = false;

function showScene(idx) {
  try { cancelTypewriter(); } catch(e) {}
  document.querySelectorAll('.scene').forEach(function(s) { s.classList.remove('active'); });
  var el = document.getElementById(SCENES[idx].id);
  if (el) el.classList.add('active');
  currentSceneIdx = idx;
  sfxWhoosh();

  if (idx === 0) {
    startWind();
    typeWriter(document.getElementById('hook-text'),
      'Want a Minecraft\nexperience but you actually\ncan\'t afford Minecraft right now?', 45, function() {
      setTimeout(function() {
        typeWriter(document.getElementById('hook-sub'),
          'Yeah, we\'ve all been there.\nLet me show you something.\nThis is BlockForge.', 35);
      }, 400);
    });
  }

  if (idx === 1) {
    startWind();
    sfxBlock();
    typeWriter(document.getElementById('showcase-text'),
      'It runs entirely in your browser.\nIt costs you absolutely nothing.', 40, function() {
      setTimeout(function() {
        typeWriter(document.getElementById('showcase-sub'),
          'That\'s not a recording of Minecraft.\nThat\'s BlockForge, live, in a browser tab.\nNo download. No launcher. No credit card.', 35);
      }, 500);
    });
  }

  if (idx === 2) {
    stopWind();
    sfxReveal();
    var cards = document.querySelectorAll('.feature-card');
    cards.forEach(function(card, i) {
      setTimeout(function() { card.classList.add('show'); sfxPop(); }, i * 250 + 200);
    });
  }

  if (idx === 3) {
    stopWind();
    typeWriter(document.getElementById('sunset-text'),
      'When the sun sets in BlockForge...\nthe sky shifts to deep indigo,\nstars come out, and the moon\nlights up everything you\'ve built.', 40, function() {
      setTimeout(function() {
        typeWriter(document.getElementById('sunset-sub'),
          'This isn\'t a tech demo.\nThis is an actual game.', 45);
      }, 600);
    });
  }

  if (idx === 4) {
    stopWind();
    sfxResolve();
  }
}

function tick(timestamp) {
  if (!startTime) startTime = timestamp;
  var elapsed = (timestamp - startTime) / 1000;
  var pct = Math.min(elapsed / TOTAL_DURATION, 1);
  var bar = document.getElementById('progress');
  if (bar) bar.style.width = (pct * 100) + '%';

  for (var i = SCENES.length - 1; i >= 0; i--) {
    if (elapsed >= SCENES[i].start && currentSceneIdx !== i) {
      showScene(i);
      break;
    }
  }

  if (elapsed < TOTAL_DURATION && !skipped) {
    animId = requestAnimationFrame(tick);
  } else if (bar) {
    bar.style.width = '100%';
  }
}

function startTimer() {
  if (startTime) return;
  startTime = performance.now();
  animId = requestAnimationFrame(tick);
  console.log('[Promo] timer started');
}

showScene(0);

document.addEventListener('click', function() {
  try { ctx(); } catch(e) {}
  startTimer();
});
document.addEventListener('touchstart', function() { startTimer(); });

// Fallback: auto-start after 500ms
setTimeout(function() { startTimer(); }, 500);

document.getElementById('skip-btn').addEventListener('click', function(e) {
  e.stopPropagation();
  skipped = true;
  if (animId) cancelAnimationFrame(animId);
  showScene(4);
  var bar = document.getElementById('progress');
  if (bar) bar.style.width = '100%';
  document.getElementById('skip-btn').textContent = '↻ RESTART';
  document.getElementById('skip-btn').onclick = function() { location.reload(); };
});

console.log('[Promo] loaded — ' + TOTAL_DURATION + 's, ' + SCENES.length + ' scenes');
</script>

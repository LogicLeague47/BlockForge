<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Merge Keep 3D — P0</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="topbar">
      <div class="pill" id="pill-gold">🪙 <b id="v-gold">0</b></div>
      <div class="pill" id="pill-elixir">🧪 <b id="v-elixir">0</b></div>
      <div class="pill" id="pill-trophy">🏆 <b id="v-trophy">0</b></div>
      <div class="pill" id="pill-wave">🌙 <b id="v-wave">Base</b></div>
    </div>
    <div id="modebar">
      <button data-mode="build" class="active">🔨 Build</button>
      <button data-mode="defend">🌙 Defend</button>
      <button data-mode="raid">⚔️ Raid</button>
    </div>
    <div id="dock"></div>
    <div id="toast"></div>
    <div id="help">Drag: orbit • Wheel: zoom • Right-drag: pan • Click tile: place/select • M: merge • Deploy troops by clicking edge in Raid</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

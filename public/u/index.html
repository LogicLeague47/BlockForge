<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockForge</title>
  <link rel="icon" type="image/png" href="../BlockForge.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a12;color:#e0e0e0;font-family:monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .card{background:rgba(0,0,0,0.55);border:1px solid rgba(80,80,100,0.35);border-radius:8px;padding:28px 32px;max-width:400px;width:90%;text-align:center}
    .logo{font-size:22px;letter-spacing:6px;color:#fff;margin-bottom:2px}
    .sub{font:11px monospace;color:#7ab;letter-spacing:2px;margin-bottom:18px}
    .name{font:bold 18px monospace;color:#ffdd33;margin-bottom:4px}
    .role{font:11px monospace;color:#7af;margin-bottom:16px}
    .link-box{background:rgba(0,0,0,0.4);border:1px solid rgba(120,200,255,0.3);border-radius:4px;padding:10px;margin:12px 0;word-break:break-all;font:12px monospace;color:#7cf;cursor:pointer;user-select:all}
    .link-box:hover{border-color:rgba(120,200,255,0.6)}
    .hint{font:11px monospace;min-height:16px;margin:8px 0;color:#5a8}
    .btn{width:100%;padding:12px;font-size:13px;border:1px solid #2a5a2a;background:linear-gradient(180deg,#4a7a4a 0%,#3a6a3a 40%,#2a5a2a 60%,#1a4a1a 100%);color:#fff;border-radius:4px;cursor:pointer;font-family:monospace}
    .btn:disabled{opacity:0.5;cursor:not-allowed}
    .footer{font:9px monospace;color:rgba(255,255,255,0.25);margin-top:14px}
    .bypass{font:bold 13px monospace;color:#f55;line-height:1.6}
    .copy-ok{font:11px monospace;color:#5f5;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">BLOCKFORGE</div>
    <div class="sub" id="subtitle"></div>
    <div class="name" id="pname"></div>
    <div class="role" id="prole"></div>
    <div class="hint" id="hint"></div>
    <div id="homepage" style="display:none">
      <div style="font:11px monospace;color:#999;margin-bottom:6px;">Share your link with friends:</div>
      <div class="link-box" id="link-box" title="Click to copy"></div>
      <div class="copy-ok" id="copy-ok"></div>
      <button class="btn" id="play-btn" style="margin-top:14px;">Play BlockForge</button>
    </div>
    <div class="bypass" id="bypass" style="display:none"></div>
    <div class="footer">By continuing, you agree to the Terms of Service</div>
  </div>
  <script>
    (function() {
      var urlUser = '';
      try { urlUser = new URLSearchParams(location.search).get('user') || ''; } catch(e) {}
      if (!urlUser) {
        var path = location.pathname;
        var match = path.match(/\/u\/([^/]+)\/?$/);
        if (match) urlUser = decodeURIComponent(match[1]);
      }

      var nameEl = document.getElementById('pname');
      var roleEl = document.getElementById('prole');
      var hintEl = document.getElementById('hint');
      var subtitleEl = document.getElementById('subtitle');
      var homepageEl = document.getElementById('homepage');
      var bypassEl = document.getElementById('bypass');
      var linkBoxEl = document.getElementById('link-box');
      var copyOkEl = document.getElementById('copy-ok');
      var playBtnEl = document.getElementById('play-btn');

      if (!urlUser) {
        subtitleEl.textContent = 'PLAYER LOGIN';
        nameEl.textContent = 'No player specified';
        hintEl.style.color = '#f55';
        hintEl.textContent = 'Add ?user=YourName to the URL.';
        return;
      }

      var fromU = false;
      try { fromU = sessionStorage.getItem('bf_from_u') === '1'; } catch(e) {}
      try {
        var fromParam = new URLSearchParams(location.search).get('from') || '';
        if (fromParam === 'game') fromU = true;
      } catch(e) {}
      if (fromU) sessionStorage.removeItem('bf_from_u');

      var savedRole = '';
      try { savedRole = localStorage.getItem('bf_role') || ''; } catch(e) {}

      if (fromU) {
        // Opened from within the game — show user homepage
        subtitleEl.textContent = 'PLAYER LINK';
        nameEl.textContent = urlUser;
        roleEl.textContent = savedRole ? 'Role: ' + savedRole : '';

        var linkUrl = location.origin + location.pathname + '?user=' + encodeURIComponent(urlUser);
        linkBoxEl.textContent = linkUrl;

        homepageEl.style.display = '';

        linkBoxEl.addEventListener('click', function() {
          try {
            navigator.clipboard.writeText(linkUrl);
            copyOkEl.textContent = 'Link copied!';
            setTimeout(function() { copyOkEl.textContent = ''; }, 2000);
          } catch(e) {
            copyOkEl.textContent = 'Select and copy manually';
          }
        });

        playBtnEl.addEventListener('click', function() {
          window.location.href = '../?user=' + encodeURIComponent(urlUser);
        });
      } else {
        // Pasted directly — bypass warning
        subtitleEl.textContent = '';
        nameEl.textContent = urlUser;
        roleEl.textContent = '';
        bypassEl.textContent = 'You may not bypass login. Please log in through the game.';
        bypassEl.style.display = '';
        hintEl.style.display = 'none';
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YT Forge</title>
<link rel="icon" type="image/png" href="../BlockForge.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e6e6f0;font-family:monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 0,rgba(180,40,40,.12) 0,transparent 60%),radial-gradient(ellipse at 70% 100%,rgba(60,60,180,.1) 0,transparent 50%);pointer-events:none}
.wrap{width:96vw;max-width:1000px;z-index:1;padding:16px 0}
.topbar{display:flex;align-items:center;margin-bottom:14px}
.topbar .logo{font-size:20px;font-weight:bold;color:#fff;white-space:nowrap;margin-right:12px}
.topbar .logo span{color:#f44}
.back{color:#8af;font:12px monospace;text-decoration:none;white-space:nowrap}
.back:hover{text-decoration:underline}
.search-row{display:flex;margin-bottom:6px}
.search-row input{flex:1;padding:10px 14px;font:14px/1.4 monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);border-right:none;border-radius:8px 0 0 8px;color:#fff;outline:none}
.search-row input:focus{border-color:rgba(200,80,80,.6)}
.search-row button{padding:10px 18px;font:14px/1.4 monospace;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:0 8px 8px 0;color:#fff;cursor:pointer}
.search-row button:hover{background:rgba(220,50,50,.9)}
.search-links{font-size:11px;margin-bottom:12px}
.search-links a{color:#8af;text-decoration:none}
.status{font-size:11px;color:#888;margin-bottom:10px;min-height:16px}
.player-outer{position:relative;width:100%;padding-bottom:56.25%;background:#000;border-radius:10px;overflow:hidden;margin-bottom:4px;display:none}
.player-outer iframe,
.player-outer .yt-api-player{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.custom-controls{display:none;width:100%;background:rgba(20,20,40,.9);border-radius:0 0 10px 10px;padding:6px 10px;margin-bottom:10px}
.ctrl-row{display:flex;align-items:center}
.ctrl-btn{background:none;border:none;color:#ccc;font:16px/1 monospace;cursor:pointer;padding:4px 8px;-webkit-tap-highlight-color:transparent}
.ctrl-btn:hover{color:#fff}
.ctrl-time{font-size:11px;color:#aaa;margin:0 8px;white-space:nowrap}
.progress-wrap{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;position:relative;margin:0 6px}
.progress-fill{height:100%;background:#f44;border-radius:2px;width:0;pointer-events:none}
.progress-buffered{height:100%;background:rgba(255,255,255,.2);border-radius:2px;width:0;position:absolute;top:0;left:0;pointer-events:none}
.vol-wrap{display:flex;align-items:center;margin-left:4px}
.vol-bar{width:60px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;cursor:pointer;position:relative;margin:0 4px}
.vol-fill{height:100%;background:#8af;border-radius:2px;width:80%;pointer-events:none}
.yt-link{font-size:11px;margin-bottom:14px;display:none}
.yt-link a{color:#8af;text-decoration:none}
.yt-link a:hover{text-decoration:underline}
.now-playing{margin-bottom:16px;display:none}
.np-title{font-size:16px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:6px}
.np-meta{display:flex;align-items:center;flex-wrap:wrap}
.np-channel{display:flex;align-items:center;margin-right:10px}
.np-avatar{width:36px;height:36px;border-radius:50%;background:#222}
.np-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.np-channel-name{font-size:13px;font-weight:bold;color:#ddd}
.np-subs{font-size:11px;color:#888}
.np-stats{font-size:11px;color:#888}
.results{display:flex;flex-direction:column}
.result-item{display:flex;padding:8px;margin-bottom:8px;background:rgba(20,20,40,.7);border:1px solid rgba(90,90,140,.18);border-radius:8px;cursor:pointer}
.result-item:active{background:rgba(40,40,80,.75)}
.r-thumb{width:168px;min-width:168px;height:94px;background:#111;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0}
.r-thumb img{width:100%;height:100%;object-fit:cover}
.r-thumb .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.82);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}
.r-body{display:flex;min-width:0;flex:1}
.r-avatar{width:36px;height:36px;border-radius:50%;background:#222;flex-shrink:0;overflow:hidden;margin-top:2px;margin-right:10px}
.r-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.r-info{display:flex;flex-direction:column;min-width:0;flex:1}
.r-title{font-size:13px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r-channel{font-size:11px;color:#aaa;line-height:1.3}
.r-channel .vbadge{font-size:9px;background:rgba(255,255,255,.12);padding:0 4px;border-radius:3px;margin-left:3px;color:#ccc}
.r-stats{font-size:11px;color:#777;line-height:1.3}
.empty{text-align:center;padding:40px 0;color:#666;font-size:13px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#555}
@media(max-width:600px){
  .r-thumb{width:120px;min-width:120px;height:68px}
  .r-title{font-size:12px}
  .r-avatar{width:28px;height:28px}
  .np-avatar{width:28px;height:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="logo"><span>YT</span> Forge</span>
    <a class="back" href="../games.html?v=2">&larr; Games</a>
  </div>

  <div class="search-row">
    <input id="q" type="text" placeholder="Search YouTube..." autocomplete="off">
    <button id="btn-search">Search</button>
  </div>
  <div class="search-links" id="search-links"></div>
  <div class="status" id="status"></div>

  <div class="player-outer" id="player-outer">
    <div id="api-player" class="yt-api-player"></div>
    <iframe id="fallback-player" style="display:none" webkitallowfullscreen mozallowfullscreen allowfullscreen="allowfullscreen"></iframe>
  </div>
  <div class="custom-controls" id="custom-controls">
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btn-play" title="Play/Pause">&#9654;</button>
      <span class="ctrl-time" id="time-display">0:00 / 0:00</span>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-buffered" id="progress-buffered"></div>
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="vol-wrap">
        <button class="ctrl-btn" id="btn-mute" title="Mute">&#128266;</button>
        <div class="vol-bar" id="vol-bar">
          <div class="vol-fill" id="vol-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="yt-link" id="yt-link"></div>
  <div class="now-playing" id="now-playing">
    <div class="np-title" id="np-title"></div>
    <div class="np-meta">
      <div class="np-channel" id="np-channel"></div>
      <div class="np-stats" id="np-stats"></div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty">Search for something to get started</div>
  </div>

  <div class="footer">Powered by YouTube &middot; LogicLeague</div>
</div>

<script>
var YT_FORGE = {
  apiReady: false,
  player: null,
  mode: 'none',
  currentId: null,
  progressTimer: null
};

(function loadYTApi() {
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = function() { YT_FORGE.fallbackMode('API script failed to load'); };
  var ref = document.getElementsByTagName('script')[0];
  ref.parentNode.insertBefore(s, ref);

  setTimeout(function() {
    if (!YT_FORGE.apiReady) YT_FORGE.fallbackMode('API timed out');
  }, 8000);
})();

function onYouTubeIframeAPIReady() {
  try {
    YT_FORGE.player = new YT.Player('api-player', {
      height: '100%',
      width: '100%',
      videoId: '',
      playerVars: {
        autoplay: 0, controls: 0, disablekb: 1, fs: 0,
        iv_load_policy: 3, modestbranding: 1, rel: 0,
        showinfo: 0, playsinline: 1, origin: location.origin
      },
      events: {
        onReady: function() {
          YT_FORGE.apiReady = true;
          YT_FORGE.mode = 'api';
        },
        onStateChange: function(e) {
          var btn = document.getElementById('btn-play');
          if (e.data === YT.PlayerState.PLAYING) {
            btn.innerHTML = '&#9646;&#9646;';
            YT_FORGE.startProgress();
          } else if (e.data === YT.PlayerState.PAUSED) {
            btn.innerHTML = '&#9654;';
            YT_FORGE.stopProgress();
          } else if (e.data === YT.PlayerState.ENDED) {
            btn.innerHTML = '&#9654;';
            YT_FORGE.stopProgress();
            document.getElementById('progress-fill').style.width = '100%';
          }
        },
        onError: function() {
          YT_FORGE.fallbackMode('Player error');
        }
      }
    });
  } catch(ex) {
    YT_FORGE.fallbackMode('YT.Player constructor failed: ' + ex.message);
  }
}

YT_FORGE.fallbackMode = function(reason) {
  if (YT_FORGE.mode === 'fallback') return;
  YT_FORGE.mode = 'fallback';
  var apiDiv = document.getElementById('api-player');
  var fb = document.getElementById('fallback-player');
  if (apiDiv) apiDiv.style.display = 'none';
  if (fb) fb.style.display = 'block';
};

YT_FORGE.play = function(id) {
  YT_FORGE.currentId = id;
  document.getElementById('player-outer').style.display = 'block';
  document.getElementById('custom-controls').style.display = 'block';

  if (YT_FORGE.mode === 'api' && YT_FORGE.player && YT_FORGE.player.loadVideoById) {
    try {
      YT_FORGE.player.loadVideoById(id);
      return;
    } catch(ex) {}
  }

  var fb = document.getElementById('fallback-player');
  fb.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1&controls=1&enablejsapi=1&modestbranding=1&showinfo=0&iv_load_policy=3&fs=1&origin=' + encodeURIComponent(location.origin);
  YT_FORGE.mode = 'fallback';
  YT_FORGE.startFallbackPoll(id);
};

YT_FORGE.startFallbackPoll = function(id) {
  YT_FORGE.stopProgress();
  YT_FORGE.progressTimer = setInterval(function() {
    document.getElementById('progress-fill').style.width = '50%';
    document.getElementById('time-display').textContent = 'playing...';
  }, 1000);
};

YT_FORGE.startProgress = function() {
  YT_FORGE.stopProgress();
  YT_FORGE.progressTimer = setInterval(function() {
    if (!YT_FORGE.player || !YT_FORGE.player.getDuration) return;
    var cur = YT_FORGE.player.getCurrentTime() || 0;
    var dur = YT_FORGE.player.getDuration() || 1;
    document.getElementById('progress-fill').style.width = ((cur / dur) * 100) + '%';
    document.getElementById('time-display').textContent = YT_FORGE.fmtTime(cur) + ' / ' + YT_FORGE.fmtTime(dur);
  }, 250);
};

YT_FORGE.stopProgress = function() {
  if (YT_FORGE.progressTimer) { clearInterval(YT_FORGE.progressTimer); YT_FORGE.progressTimer = null; }
};

YT_FORGE.fmtTime = function(s) {
  s = Math.floor(s || 0);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  var sec = s % 60;
  if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
};

(function(){
  var API = 'https://blockforge-server.onrender.com/api/yt-search';
  var YTS = 'https://www.youtube.com/results?search_query=';
  var playerOuter = document.getElementById('player-outer');
  var controlsEl = document.getElementById('custom-controls');
  var resultsEl = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var qInput = document.getElementById('q');
  var btnSearch = document.getElementById('btn-search');
  var npWrap = document.getElementById('now-playing');
  var npTitle = document.getElementById('np-title');
  var npChannel = document.getElementById('np-channel');
  var npStats = document.getElementById('np-stats');
  var ytLinkEl = document.getElementById('yt-link');
  var searchLinksEl = document.getElementById('search-links');

  function setStatus(msg) { statusEl.textContent = msg; }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  function fmtNum(n) {
    if (n == null) return '';
    n = parseInt(n, 10);
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function fmtDuration(s) {
    if (!s) return '';
    s = parseInt(s, 10);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function ytThumb(vid) {
    return 'https://i.ytimg.com/vi/' + vid + '/default.jpg';
  }

  function ytChannelThumb(thumbs) {
    if (!thumbs || !thumbs.length) return '';
    for (var i = 0; i < thumbs.length; i++) {
      if (thumbs[i].width >= 76) return thumbs[i].url;
    }
    return thumbs[thumbs.length - 1].url;
  }

  function playVideo(id, title, author, authorId, viewCount) {
    YT_FORGE.play(id);

    ytLinkEl.innerHTML = '<a href="https://www.youtube.com/watch?v=' + id + '" target="_blank">Open on YouTube &#x2197;</a>';
    ytLinkEl.style.display = 'block';
    npTitle.textContent = title || '';

    var channelHtml = '<div class="np-channel-name">' + esc(author || 'Unknown') + '</div>';
    if (authorId) channelHtml += '<div class="np-subs"><a href="https://youtube.com/channel/' + authorId + '" target="_blank" style="color:#8af;text-decoration:none">Visit channel &#x2197;</a></div>';
    npChannel.innerHTML = channelHtml;

    var statsHtml = '';
    if (viewCount) statsHtml = fmtNum(viewCount) + ' views';
    npStats.innerHTML = statsHtml;

    npWrap.style.display = 'block';
    window.scrollTo(0, 0);
  }

  document.getElementById('btn-play').addEventListener('click', function() {
    if (YT_FORGE.mode === 'api' && YT_FORGE.player) {
      var st = YT_FORGE.player.getPlayerState ? YT_FORGE.player.getPlayerState() : -1;
      if (st === YT.PlayerState.PLAYING) YT_FORGE.player.pauseVideo();
      else YT_FORGE.player.playVideo();
    }
  });

  document.getElementById('progress-wrap').addEventListener('click', function(e) {
    if (YT_FORGE.mode === 'api' && YT_FORGE.player && YT_FORGE.player.seekTo) {
      var rect = this.getBoundingClientRect();
      var pct = (e.clientX - rect.left) / rect.width;
      YT_FORGE.player.seekTo(pct * (YT_FORGE.player.getDuration() || 0), true);
    }
  });

  document.getElementById('btn-mute').addEventListener('click', function() {
    if (YT_FORGE.mode === 'api' && YT_FORGE.player) {
      if (YT_FORGE.player.isMuted()) { YT_FORGE.player.unMute(); this.innerHTML = '&#128266;'; }
      else { YT_FORGE.player.mute(); this.innerHTML = '&#128263;'; }
    }
  });

  document.getElementById('vol-bar').addEventListener('click', function(e) {
    if (YT_FORGE.mode === 'api' && YT_FORGE.player && YT_FORGE.player.setVolume) {
      var rect = this.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      YT_FORGE.player.setVolume(pct * 100);
      document.getElementById('vol-fill').style.width = (pct * 100) + '%';
    }
  });

  function renderResults(items) {
    if (!items || items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">No results found</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var v = items[i];
      if (v.type !== 'video' && v.type !== 'short') continue;
      var vid = v.videoId;
      if (!vid) continue;
      var title = esc(v.title || 'Untitled');
      var author = esc(v.author || '');
      var authorId = v.authorId || '';
      var published = esc(v.publishedText || '');
      var views = v.viewCount ? fmtNum(v.viewCount) + ' views' : '';
      var length = v.lengthSeconds ? fmtDuration(v.lengthSeconds) : '';
      var verified = v.authorVerified;
      var thumb = ytThumb(vid);
      var avatarUrl = ytChannelThumb(v.authorThumbnails);

      var metaLine = '';
      if (author) {
        metaLine += '<span class="r-channel">' + author;
        if (verified) metaLine += ' <span class="vbadge">&#x2713;</span>';
        metaLine += '</span>';
      }
      if (published) metaLine += '<span class="r-stats"> &middot; ' + published + '</span>';
      if (views) metaLine += '<span class="r-stats"> &middot; ' + views + '</span>';

      html += '<div class="result-item" data-vid="' + esc(vid) + '"'
        + ' data-title="' + esc(v.title || '') + '"'
        + ' data-author="' + esc(v.author || '') + '"'
        + ' data-authorid="' + esc(authorId) + '"'
        + ' data-views="' + (v.viewCount || '') + '"'
        + '>'
        + '<div class="r-thumb">'
        + '<img src="' + thumb + '" alt="">'
        + (length ? '<span class="dur">' + length + '</span>' : '')
        + '</div>'
        + '<div class="r-body">'
        + (avatarUrl ? '<div class="r-avatar"><img src="' + esc(avatarUrl) + '" alt=""></div>' : '')
        + '<div class="r-info">'
        + '<div class="r-title">' + title + '</div>'
        + metaLine
        + '</div></div></div>';
    }
    if (!html) {
      resultsEl.innerHTML = '<div class="empty">No video results found</div>';
      return;
    }
    resultsEl.innerHTML = html;

    var allItems = resultsEl.querySelectorAll('.result-item');
    for (var j = 0; j < allItems.length; j++) {
      bindResult(allItems[j]);
    }
  }

  function bindResult(el) {
    var sy = 0;
    var moved = false;
    el.addEventListener('touchstart', function(e) {
      sy = e.touches[0].clientY;
      moved = false;
    }, true);
    el.addEventListener('touchmove', function(e) {
      if (Math.abs(e.touches[0].clientY - sy) > 10) moved = true;
    }, true);
    el.addEventListener('click', function(e) {
      e.preventDefault();
      playVideo(
        el.getAttribute('data-vid'),
        el.getAttribute('data-title'),
        el.getAttribute('data-author'),
        el.getAttribute('data-authorid'),
        el.getAttribute('data-views')
      );
    });
    el.addEventListener('touchend', function(e) {
      if (moved) return;
      e.preventDefault();
      playVideo(
        el.getAttribute('data-vid'),
        el.getAttribute('data-title'),
        el.getAttribute('data-author'),
        el.getAttribute('data-authorid'),
        el.getAttribute('data-views')
      );
    });
  }

  function doSearch(query) {
    query = (query || '').trim();
    if (!query) return;
    setStatus('Searching...');
    resultsEl.innerHTML = '';
    playerOuter.style.display = 'none';
    controlsEl.style.display = 'none';
    npWrap.style.display = 'none';
    ytLinkEl.style.display = 'none';
    searchLinksEl.innerHTML = '<a href="javascript:void(0)" onclick="window.open(\'' + YTS + encodeURIComponent(query) + '\',\'_blank\')">Open "' + esc(query) + '" on YouTube &#x2197;</a>';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', API + '?q=' + encodeURIComponent(query), true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var data = JSON.parse(xhr.responseText);
          setStatus('');
          renderResults(data);
        } catch(e) {
          setStatus('Parse error');
          resultsEl.innerHTML = '<div class="empty">Bad response from server</div>';
        }
      } else {
        setStatus('Server error (' + xhr.status + ')');
      }
    };
    xhr.onerror = function() { setStatus('Network error'); };
    xhr.ontimeout = function() { setStatus('Timed out'); };
    xhr.send();
  }

  btnSearch.addEventListener('click', function() { doSearch(qInput.value); });
  qInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13 || e.key === 'Enter') { e.preventDefault(); doSearch(qInput.value); }
  });

  qInput.focus();
})();
</script>
</body>
</html>

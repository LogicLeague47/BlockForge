<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YT Forge</title>
<link rel="icon" type="image/png" href="../BlockForge.png">
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://yewtu.be" crossorigin>
<link rel="dns-prefetch" href="https://i.ytimg.com">
<link rel="dns-prefetch" href="https://yewtu.be">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e6e6f0;font-family:monospace;min-height:100vh;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 0,rgba(180,40,40,.12) 0,transparent 60%),radial-gradient(ellipse at 70% 100%,rgba(60,60,180,.1) 0,transparent 50%);pointer-events:none}
.wrap{width:96vw;max-width:1000px;z-index:1;padding:16px 0}
.topbar{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:14px}
.topbar .logo{font-size:20px;font-weight:bold;color:#fff;white-space:nowrap;margin-right:12px}
.topbar .logo span{color:#f44}
.back{color:#8af;font:12px monospace;text-decoration:none;white-space:nowrap}
.back:hover{text-decoration:underline}
.search-row{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:6px}
.search-row input{-webkit-flex:1;flex:1;padding:10px 14px;font:14px/1.4 monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);border-right:none;border-radius:8px 0 0 8px;color:#fff;outline:none}
.search-row input:focus{border-color:rgba(200,80,80,.6)}
.search-row button{padding:10px 18px;font:14px/1.4 monospace;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:0 8px 8px 0;color:#fff;cursor:pointer}
.search-row button:hover{background:rgba(220,50,50,.9)}
.search-links{font-size:11px;margin-bottom:12px}
.search-links a{color:#8af;text-decoration:none}
.status{font-size:11px;color:#888;margin-bottom:4px;min-height:16px}
.dbg{font-size:10px;color:#567;margin-bottom:10px;min-height:14px;word-break:break-all}

.player-box{position:relative;width:100%;padding-bottom:56.25%;background:#000;border-radius:10px;overflow:hidden;margin-bottom:4px;display:none}
.player-box video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000}
.player-box iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

.preview-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;cursor:pointer;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.preview-overlay img{position:absolute;top:0;left:0;width:100%;height:100%;-o-object-fit:cover;object-fit:cover}
.preview-overlay .play-btn{position:relative;z-index:1;width:64px;height:64px;background:rgba(180,40,40,.88);border-radius:50%;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 2px 16px rgba(0,0,0,.5)}
.preview-overlay .play-btn::after{content:'';display:block;width:0;height:0;border-style:solid;border-width:12px 0 12px 22px;border-color:transparent transparent transparent #fff;margin-left:4px}
.preview-overlay .play-btn:active{background:rgba(220,50,50,1)}
.preview-overlay .preview-title{position:relative;z-index:1;background:rgba(0,0,0,.65);color:#fff;font:bold 13px/1.3 monospace;padding:8px 12px;border-radius:6px;margin-top:10px;max-width:90%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-overlay .preview-hint{position:relative;z-index:1;font:11px monospace;color:#aaa;margin-top:6px}

.loader{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);z-index:2;display:none}
.loader .spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#f44;border-radius:50%;-webkit-animation:spin .8s linear infinite;animation:spin .8s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

.block-msg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:rgba(0,0,0,.88);padding:20px;text-align:center;overflow:auto}
.block-msg .icon{font-size:28px;margin-bottom:6px}
.block-msg .msg{font:13px monospace;color:#ccc;margin-bottom:10px}
.block-msg .pbtn{display:block;width:90%;max-width:320px;margin:0 auto 8px;padding:10px;font:bold 13px monospace;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:8px;color:#fff;cursor:pointer;text-decoration:none}
.block-msg .pbtn:active{background:rgba(220,50,50,1)}
.block-msg .pbtn.alt{background:rgba(60,70,120,.6);border-color:rgba(100,120,200,.4)}
.block-msg .pbtn.alt:active{background:rgba(80,95,160,.9)}

.yt-link{font-size:11px;margin-bottom:14px;display:none}
.yt-link a{color:#8af;text-decoration:none}
.yt-link a:hover{text-decoration:underline}
.now-playing{margin-bottom:16px;display:none}
.np-title{font-size:16px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:6px}
.np-meta{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.np-channel{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-right:10px}
.np-avatar{width:36px;height:36px;border-radius:50%;background:#222;overflow:hidden}
.np-avatar img{width:100%;height:100%;border-radius:50%}
.np-channel-name{font-size:13px;font-weight:bold;color:#ddd}
.np-subs{font-size:11px;color:#888}
.np-stats{font-size:11px;color:#888}
.results{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.result-item{display:-webkit-box;display:-webkit-flex;display:flex;padding:8px;margin-bottom:8px;background:rgba(20,20,40,.7);border:1px solid rgba(90,90,140,.18);border-radius:8px;cursor:pointer}
.result-item:active{background:rgba(40,40,80,.75)}
.r-thumb{width:168px;min-width:168px;height:94px;background:#111;border-radius:6px;overflow:hidden;position:relative;-webkit-flex-shrink:0;flex-shrink:0}
.r-thumb img{width:100%;height:100%}
.r-thumb .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.82);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}
.r-body{display:-webkit-box;display:-webkit-flex;display:flex;min-width:0;-webkit-flex:1;flex:1}
.r-avatar{width:36px;height:36px;border-radius:50%;background:#222;-webkit-flex-shrink:0;flex-shrink:0;overflow:hidden;margin-top:2px;margin-right:10px}
.r-avatar img{width:100%;height:100%;border-radius:50%}
.r-info{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;-webkit-flex:1;flex:1}
.r-title{font-size:13px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r-channel{font-size:11px;color:#aaa;line-height:1.3}
.r-channel .vbadge{font-size:9px;background:rgba(255,255,255,.12);padding:0 4px;border-radius:3px;margin-left:3px;color:#ccc}
.r-stats{font-size:11px;color:#777;line-height:1.3}
.empty{text-align:center;padding:40px 0;color:#666;font-size:13px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#555}
@media(max-width:600px){
  .r-thumb{width:120px;min-width:120px;height:68px}
  .r-title{font-size:12px}
  .r-avatar{width:28px;height:28px}
  .np-avatar{width:28px;height:28px}
  .preview-overlay .play-btn{width:52px;height:52px}
  .preview-overlay .play-btn::after{border-width:10px 0 10px 18px;margin-left:3px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="logo"><span>YT</span> Forge</span>
    <a class="back" href="../games.html?v=2">&larr; Games</a>
  </div>

  <div class="search-row">
    <input id="q" type="text" placeholder="Search YouTube..." autocomplete="off">
    <button id="btn-search">Search</button>
  </div>
  <div class="search-links" id="search-links"></div>
  <div class="status" id="status"></div>
  <div class="dbg" id="dbg"></div>

  <div class="player-box" id="player-box">
    <div class="preview-overlay" id="preview-overlay">
      <img id="preview-thumb" src="" alt="">
      <div class="play-btn" id="play-btn"></div>
      <div class="preview-title" id="preview-title"></div>
      <div class="preview-hint">Tap to play</div>
    </div>
    <video id="nativevid" controls="controls" playsinline="playsinline" webkit-playsinline="webkit-playsinline" preload="metadata" style="display:none"></video>
    <iframe id="classicframe" style="display:none" webkitallowfullscreen allowfullscreen="allowfullscreen" playsinline="playsinline" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <div class="loader" id="player-loader"><div class="spin"></div></div>
    <div class="block-msg" id="block-msg">
      <div class="icon">&#9888;</div>
      <div class="msg" id="block-text">Video wouldn't play.</div>
      <button class="pbtn" id="btn-direct">Try direct MP4</button>
      <a class="pbtn alt" id="link-myt" href="#" target="_blank">Open mobile YouTube</a>
      <a class="pbtn alt" id="link-app" href="#">Open YouTube app</a>
      <a class="pbtn alt" id="link-yt" href="#" target="_blank">Watch on YouTube</a>
    </div>
  </div>
  <div class="yt-link" id="yt-link"></div>
  <div class="now-playing" id="now-playing">
    <div class="np-title" id="np-title"></div>
    <div class="np-meta">
      <div class="np-channel" id="np-channel"></div>
      <div class="np-stats" id="np-stats"></div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty">Search for something to get started</div>
  </div>

  <div class="footer">Powered by YouTube &middot; LogicLeague</div>
</div>

<script>
(function(){
  var API = 'https://blockforge-server.onrender.com/api/yt-search';
  var YTS = 'https://www.youtube.com/results?search_query=';
  var LV = 'https://yewtu.be/latest_version?id=';
  var playerBox = document.getElementById('player-box');
  var previewOverlay = document.getElementById('preview-overlay');
  var previewThumb = document.getElementById('preview-thumb');
  var previewTitle = document.getElementById('preview-title');
  var playBtn = document.getElementById('play-btn');
  var playerLoader = document.getElementById('player-loader');
  var blockMsg = document.getElementById('block-msg');
  var blockText = document.getElementById('block-text');
  var btnDirect = document.getElementById('btn-direct');
  var linkMyt = document.getElementById('link-myt');
  var linkApp = document.getElementById('link-app');
  var linkYt = document.getElementById('link-yt');
  var nativevid = document.getElementById('nativevid');
  var classicframe = document.getElementById('classicframe');
  var resultsEl = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var dbgEl = document.getElementById('dbg');
  var qInput = document.getElementById('q');
  var btnSearch = document.getElementById('btn-search');
  var npWrap = document.getElementById('now-playing');
  var npTitle = document.getElementById('np-title');
  var npChannel = document.getElementById('np-channel');
  var npStats = document.getElementById('np-stats');
  var ytLinkEl = document.getElementById('yt-link');
  var searchLinksEl = document.getElementById('search-links');

  var currentVid = '';
  var attemptTimer = null;
  var ERR_NAMES = { 1: 'aborted', 2: 'network', 3: 'decode', 4: 'src' };

  function setStatus(msg) { statusEl.textContent = msg; }

  function dbg(msg) {
    var t = dbgEl.textContent;
    t = t ? (t + ' · ' + msg) : msg;
    if (t.length > 400) t = t.slice(t.length - 400);
    dbgEl.textContent = t;
  }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  function fmtNum(n) {
    if (n == null) return '';
    n = parseInt(n, 10);
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function fmtDuration(s) {
    if (!s) return '';
    s = parseInt(s, 10);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function ytThumb(vid) {
    return 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
  }

  function ytChannelThumb(thumbs) {
    if (!thumbs || !thumbs.length) return '';
    for (var i = 0; i < thumbs.length; i++) {
      if (thumbs[i].width >= 76) return thumbs[i].url;
    }
    return thumbs[thumbs.length - 1].url;
  }

  function clearTimer() {
    if (attemptTimer) { clearTimeout(attemptTimer); attemptTimer = null; }
  }

  function resetPlayer() {
    clearTimer();
    try { nativevid.pause(); } catch (e) {}
    nativevid.removeAttribute('src');
    try { nativevid.load(); } catch (e) {}
    nativevid.style.display = 'none';
    classicframe.src = '';
    classicframe.style.display = 'none';
    playerLoader.style.display = 'none';
    blockMsg.style.display = 'none';
    previewOverlay.style.display = 'none';
  }

  function showFail(msg) {
    clearTimer();
    try { nativevid.pause(); } catch (e) {}
    nativevid.removeAttribute('src');
    try { nativevid.load(); } catch (e) {}
    nativevid.style.display = 'none';
    classicframe.src = '';
    classicframe.style.display = 'none';
    playerLoader.style.display = 'none';
    previewOverlay.style.display = 'none';
    blockText.textContent = msg || "Video wouldn't play.";
    blockMsg.style.display = 'flex';
    dbg('fail');
  }

  // Direct MP4 attempts (backup): itag 18 (360p H.264) then 22 (720p),
  // proxied through the instance (local=true) so no API call, no CORS.
  // Only works if the device holds a clearance cookie for the instance,
  // so this runs ONLY from the fallback panel, never automatically.
  var DIRECT_TRIES = [
    { tag: 'lv18', itag: '18' },
    { tag: 'lv22', itag: '22' }
  ];

  function tryDirect(idx) {
    var id = currentVid;
    if (idx >= DIRECT_TRIES.length) {
      showFail("Direct stream didn't load either. Use the YouTube links below.");
      setStatus('');
      return;
    }
    var t = DIRECT_TRIES[idx];
    var url = LV + id + '&itag=' + t.itag + '&local=true';
    dbg(t.tag + '...');
    previewOverlay.style.display = 'none';
    blockMsg.style.display = 'none';
    classicframe.style.display = 'none';
    nativevid.style.display = 'block';
    playerLoader.style.display = 'block';
    setStatus('Loading video...');
    clearTimer();

    nativevid.onerror = function() {
      var code = 0;
      try { code = nativevid.error ? nativevid.error.code : 0; } catch (e) {}
      dbg(t.tag + ' err' + code + '(' + (ERR_NAMES[code] || '?') + ')');
      clearTimer();
      tryDirect(idx + 1);
    };
    nativevid.onloadeddata = function() {
      dbg(t.tag + ' ok rs' + nativevid.readyState);
      clearTimer();
      playerLoader.style.display = 'none';
      setStatus('Loaded — press play on the video.');
    };
    nativevid.src = url;
    try { nativevid.load(); } catch (e) {}

    attemptTimer = setTimeout(function() {
      var rs = 0;
      try { rs = nativevid.readyState; } catch (e) {}
      dbg(t.tag + ' stall rs' + rs);
      tryDirect(idx + 1);
    }, 15000);
  }

  function loadStream(id) {
    // Primary path (proven on iOS 10): classic nocookie embed, autoplay
    // OFF so the in-iframe tap is a fresh user gesture, real controls.
    dbgEl.textContent = '';
    dbg('play ' + id);
    resetPlayer();
    playerBox.style.display = 'block';
    loadClassic();
  }

  function loadClassic() {
    var id = currentVid;
    dbg('classic...');
    clearTimer();
    blockMsg.style.display = 'none';
    nativevid.style.display = 'none';
    try { nativevid.pause(); } catch (e) {}
    nativevid.removeAttribute('src');
    try { nativevid.load(); } catch (e) {}
    classicframe.style.display = 'block';
    playerLoader.style.display = 'block';
    setStatus('Loading classic player...');
    classicframe.onload = function() {
      dbg('classic loaded');
      playerLoader.style.display = 'none';
      setStatus('Tap play inside the player.');
      classicframe.onload = null;
    };
    classicframe.src = 'https://www.youtube-nocookie.com/embed/' + id
      + '?autoplay=0&rel=0&playsinline=1&controls=1&fs=1&iv_load_policy=3'
      + '&origin=' + encodeURIComponent(location.protocol + '//' + location.host);
    attemptTimer = setTimeout(function() {
      if (playerLoader.style.display !== 'none') {
        dbg('classic stall');
        playerLoader.style.display = 'none';
        showFail('Classic player stalled. Try direct MP4 or the YouTube links below.');
        setStatus('');
      }
    }, 20000);
  }

  btnDirect.addEventListener('click', function() {
    dbg('manual-direct');
    blockMsg.style.display = 'none';
    tryDirect(0);
  });
  playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    loadStream(currentVid);
  });
  previewOverlay.addEventListener('click', function() {
    loadStream(currentVid);
  });

  function showPreview(id, title, author, authorId, viewCount) {
    currentVid = id;
    resetPlayer();
    previewThumb.src = ytThumb(id);
    previewTitle.textContent = title || '';
    previewOverlay.style.display = 'flex';
    playerBox.style.display = 'block';

    linkMyt.href = 'https://m.youtube.com/watch?v=' + id;
    linkApp.href = 'youtube://watch?v=' + id;
    linkYt.href = 'https://www.youtube.com/watch?v=' + id;

    npTitle.textContent = title || '';
    var channelHtml = '<div class="np-channel-name">' + esc(author || 'Unknown') + '</div>';
    if (authorId) channelHtml += '<div class="np-subs"><a href="https://youtube.com/channel/' + authorId + '" target="_blank" style="color:#8af;text-decoration:none">Visit channel &#x2197;</a></div>';
    npChannel.innerHTML = channelHtml;
    var statsHtml = '';
    if (viewCount) statsHtml = fmtNum(viewCount) + ' views';
    npStats.innerHTML = statsHtml;
    npWrap.style.display = 'block';

    ytLinkEl.innerHTML = '<a href="https://www.youtube.com/watch?v=' + id + '" target="_blank">Watch on YouTube &#x2197;</a>'
      + ' &middot; <a href="https://turboscribe.ai/downloader/youtube/video/free" target="_blank" id="dl-link" title="Opens an external downloader">Download MP4 &#x2197;</a>';
    ytLinkEl.style.display = 'block';
    var dlLink = document.getElementById('dl-link');
    if (dlLink) {
      dlLink.addEventListener('click', function() {
        try {
          var ta = document.createElement('textarea');
          ta.value = 'https://www.youtube.com/watch?v=' + id;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          if (ta.setSelectionRange) ta.setSelectionRange(0, 99999);
          if (document.execCommand('copy')) setStatus('Link copied — paste it on the download page');
          document.body.removeChild(ta);
        } catch (e) {}
      });
    }

    setStatus('');
    window.scrollTo(0, 0);
  }

  function renderResults(items) {
    if (!items || items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">No results found</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var v = items[i];
      // All videos from YT: accept anything with a playable videoId —
      // videos, shorts, livestreams, movies. Only skip channels/playlists.
      if (v.type === 'channel' || v.type === 'playlist' || v.type === 'hashtag') continue;
      var vid = v.videoId;
      if (!vid) continue;
      var title = esc(v.title || 'Untitled');
      var author = esc(v.author || '');
      var authorId = v.authorId || '';
      var published = esc(v.publishedText || '');
      var views = v.viewCount ? fmtNum(v.viewCount) + ' views' : '';
      var length = v.lengthSeconds ? fmtDuration(v.lengthSeconds) : '';
      var verified = v.authorVerified;
      var thumb = ytThumb(vid);
      var avatarUrl = ytChannelThumb(v.authorThumbnails);

      var metaLine = '';
      if (author) {
        metaLine += '<span class="r-channel">' + author;
        if (verified) metaLine += ' <span class="vbadge">&#x2713;</span>';
        metaLine += '</span>';
      }
      if (published) metaLine += '<span class="r-stats"> &middot; ' + published + '</span>';
      if (views) metaLine += '<span class="r-stats"> &middot; ' + views + '</span>';

      html += '<div class="result-item" data-vid="' + esc(vid) + '"'
        + ' data-title="' + esc(v.title || '') + '"'
        + ' data-author="' + esc(v.author || '') + '"'
        + ' data-authorid="' + esc(authorId) + '"'
        + ' data-views="' + (v.viewCount || '') + '"'
        + '>'
        + '<div class="r-thumb">'
        + '<img src="' + thumb + '" alt="">'
        + (length ? '<span class="dur">' + length + '</span>' : '')
        + '</div>'
        + '<div class="r-body">'
        + (avatarUrl ? '<div class="r-avatar"><img src="' + esc(avatarUrl) + '" alt=""></div>' : '')
        + '<div class="r-info">'
        + '<div class="r-title">' + title + '</div>'
        + metaLine
        + '</div></div></div>';
    }
    if (!html) {
      resultsEl.innerHTML = '<div class="empty">No video results found</div>';
      return;
    }
    resultsEl.innerHTML = html;

    var allItems = resultsEl.querySelectorAll('.result-item');
    for (var j = 0; j < allItems.length; j++) {
      bindResult(allItems[j]);
    }
  }

  function bindResult(el) {
    var sy = 0;
    var moved = false;
    el.addEventListener('touchstart', function(e) {
      sy = e.touches[0].clientY;
      moved = false;
    }, true);
    el.addEventListener('touchmove', function(e) {
      if (Math.abs(e.touches[0].clientY - sy) > 10) moved = true;
    }, true);
    el.addEventListener('click', function(e) {
      e.preventDefault();
      showPreview(
        el.getAttribute('data-vid'),
        el.getAttribute('data-title'),
        el.getAttribute('data-author'),
        el.getAttribute('data-authorid'),
        el.getAttribute('data-views')
      );
    });
    el.addEventListener('touchend', function(e) {
      if (moved) return;
      e.preventDefault();
      showPreview(
        el.getAttribute('data-vid'),
        el.getAttribute('data-title'),
        el.getAttribute('data-author'),
        el.getAttribute('data-authorid'),
        el.getAttribute('data-views')
      );
    });
  }

  function doSearch(query) {
    query = (query || '').trim();
    if (!query) return;
    setStatus('Searching...');
    resultsEl.innerHTML = '';
    playerBox.style.display = 'none';
    npWrap.style.display = 'none';
    ytLinkEl.style.display = 'none';
    searchLinksEl.innerHTML = '<a href="javascript:void(0)" onclick="window.open(\'' + YTS + encodeURIComponent(query) + '\',\'_blank\')">Open "' + esc(query) + '" on YouTube &#x2197;</a>';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', API + '?q=' + encodeURIComponent(query), true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var data = JSON.parse(xhr.responseText);
          setStatus('');
          renderResults(data);
        } catch(e) {
          setStatus('Parse error');
          resultsEl.innerHTML = '<div class="empty">Bad response from server</div>';
        }
      } else {
        setStatus('Server error (' + xhr.status + ')');
      }
    };
    xhr.onerror = function() { setStatus('Network error'); };
    xhr.ontimeout = function() { setStatus('Timed out'); };
    xhr.send();
  }

  btnSearch.addEventListener('click', function() { doSearch(qInput.value); });
  qInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13 || e.key === 'Enter') { e.preventDefault(); doSearch(qInput.value); }
  });

  var _origDoSearch = doSearch;
  doSearch = function(q) {
    resetPlayer();
    playerBox.style.display = 'none';
    npWrap.style.display = 'none';
    ytLinkEl.style.display = 'none';
    _origDoSearch(q);
  };

  qInput.focus();
})();
</script>
</body>
</html>

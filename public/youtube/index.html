<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YT Forge</title>
<link rel="icon" type="image/png" href="../BlockForge.png">
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://yewtu.be" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e6e6f0;font-family:monospace;min-height:100vh;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 0,rgba(180,40,40,.12) 0,transparent 60%),radial-gradient(ellipse at 70% 100%,rgba(60,60,180,.1) 0,transparent 50%);pointer-events:none}
.wrap{width:96vw;max-width:1000px;z-index:1;padding:16px 0}
.topbar{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:14px}
.topbar .logo{font-size:22px;font-weight:bold;color:#fff;white-space:nowrap;margin-right:12px;letter-spacing:1px;text-shadow:0 0 18px rgba(255,60,60,.35)}
.topbar .logo span{color:#f44}
.back{color:#cfe0ff;font:12px monospace;text-decoration:none;white-space:nowrap;background:rgba(60,70,120,.35);border:1px solid rgba(120,140,220,.35);border-radius:20px;padding:6px 14px}
.back:active{background:rgba(80,95,160,.6)}
.search-row{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:8px}
.search-row input{-webkit-flex:1;flex:1;padding:14px 16px;font:14px/1.4 monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);border-right:none;border-radius:10px 0 0 10px;color:#fff;outline:none;min-width:0}
.search-row input:focus{border-color:rgba(200,80,80,.6)}
.search-row button{padding:14px 20px;font:bold 14px/1.4 monospace;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:0 10px 10px 0;color:#fff;cursor:pointer;white-space:nowrap}
.search-row button:active{background:rgba(220,50,50,.9)}
.search-links{font-size:11px;margin-bottom:12px}
.search-links a{color:#8af;text-decoration:none}
.status{font-size:11px;color:#888;margin-bottom:4px;min-height:16px}
.dbg{font-size:10px;color:#567;margin-bottom:10px;min-height:14px;word-break:break-all}

.player-box{position:relative;width:100%;padding-bottom:56.25%;background:#000;border-radius:10px;overflow:hidden;margin-bottom:4px;display:none}
.player-box video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000}
.player-box iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}

.preview-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;cursor:pointer;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.preview-overlay img{position:absolute;top:0;left:0;width:100%;height:100%;-o-object-fit:cover;object-fit:cover}
.preview-overlay .play-btn{position:relative;z-index:1;width:64px;height:64px;background:rgba(180,40,40,.88);border-radius:50%;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 2px 16px rgba(0,0,0,.5)}
.preview-overlay .play-btn::after{content:'';display:block;width:0;height:0;border-style:solid;border-width:12px 0 12px 22px;border-color:transparent transparent transparent #fff;margin-left:4px}
.preview-overlay .play-btn:active{background:rgba(220,50,50,1)}
.preview-overlay .preview-title{position:relative;z-index:1;background:rgba(0,0,0,.65);color:#fff;font:bold 13px/1.3 monospace;padding:8px 12px;border-radius:6px;margin-top:10px;max-width:90%;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-overlay .preview-hint{position:relative;z-index:1;font:11px monospace;color:#aaa;margin-top:6px}

.loader{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);z-index:2;display:none}
.loader .spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#f44;border-radius:50%;-webkit-animation:spin .8s linear infinite;animation:spin .8s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

.block-msg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;display:none;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;background:rgba(0,0,0,.88);padding:20px;text-align:center;overflow:auto}
.block-msg .icon{font-size:28px;margin-bottom:6px}
.block-msg .msg{font:13px monospace;color:#ccc;margin-bottom:10px}
.block-msg .pbtn{display:block;width:90%;max-width:320px;margin:0 auto 8px;padding:10px;font:bold 13px monospace;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:8px;color:#fff;cursor:pointer;text-decoration:none}
.block-msg .pbtn:active{background:rgba(220,50,50,1)}
.block-msg .pbtn.alt{background:rgba(60,70,120,.6);border-color:rgba(100,120,200,.4)}
.block-msg .pbtn.alt:active{background:rgba(80,95,160,.9)}

.yt-link{font-size:11px;margin-bottom:14px;display:none}
.yt-link a{color:#8af;text-decoration:none}
.yt-link a:hover{text-decoration:underline}
.now-playing{margin-bottom:8px;display:none;background:rgba(20,20,40,.55);border:1px solid rgba(90,90,140,.2);border-radius:10px;padding:12px}
.np-title{font-size:16px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:6px}
.np-meta{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.np-channel{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-right:10px}
.np-avatar{width:36px;height:36px;border-radius:50%;background:#222;overflow:hidden}
.np-avatar img{width:100%;height:100%;border-radius:50%}
.np-channel-name{font-size:13px;font-weight:bold;color:#ddd}
.np-subs{font-size:11px;color:#888}
.np-stats{font-size:11px;color:#888}
.menu-row{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:14px}
.menu-row button{-webkit-flex:1;flex:1;padding:13px 4px;font:bold 14px monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);color:#ccc;cursor:pointer;min-width:0}
.menu-row button:first-child{border-radius:8px 0 0 8px;border-right:none}
.menu-row button:last-child{border-radius:0 8px 8px 0}
.menu-row button+button{border-left:none}
.menu-row button.on{background:rgba(180,40,40,.8);border-color:rgba(180,40,40,.6);color:#fff}
.ch-view{display:none}
.ch-back{font-size:11px;color:#8af;text-decoration:none;display:inline-block;margin-bottom:8px}
.ch-head{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:8px}
.ch-avatar{width:56px;height:56px;border-radius:50%;background:#222;overflow:hidden;-webkit-flex-shrink:0;flex-shrink:0;margin-right:12px}
.ch-avatar img{width:100%;height:100%;border-radius:50%}
.ch-name{font-size:16px;font-weight:bold;color:#fff;line-height:1.3}
.ch-subs{font-size:11px;color:#888}
.ch-desc{font-size:11px;color:#888;margin-bottom:10px;max-height:54px;overflow:hidden;line-height:1.4}
.ch-tabs{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:12px}
.ch-tabs button{-webkit-flex:1;flex:1;padding:11px 4px;font:bold 12px monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);color:#ccc;cursor:pointer}
.ch-tabs button:first-child{border-radius:8px 0 0 8px;border-right:none}
.ch-tabs button:last-child{border-radius:0 8px 8px 0}
.ch-tabs button.on{background:rgba(180,40,40,.8);border-color:rgba(180,40,40,.6);color:#fff}
.coming{display:none;text-align:center;padding:40px 0}
.coming .big{font-size:36px;margin-bottom:10px}
.coming .t{font:bold 15px monospace;color:#fff;margin-bottom:6px}
.coming .s{font-size:11px;color:#888}
.chn-link{cursor:pointer}
.feed-head{font:bold 14px monospace;color:#fff;margin-bottom:10px}
/* Minecraft-style artist profile (pure CSS, no assets) */
#channel-view{background:#1c1a24;border:3px solid #000;border-radius:4px;padding:12px;overflow:hidden}
#channel-view .ch-banner{height:100px;margin:-12px -12px 12px;background:linear-gradient(135deg,#23233a,#3a2a4a);border-bottom:3px solid #000;overflow:hidden}
#channel-view .ch-banner img{width:100%;height:100%;-o-object-fit:cover;object-fit:cover;display:none}
#channel-view .ch-head{margin:-36px 0 10px;position:relative}
#channel-view .ch-avatar{width:66px;height:66px;background:#222}
#channel-view .ch-idcol{min-width:0}
#channel-view .ch-name{font-size:17px}
#channel-view .ch-vbadge{display:inline-block;font-size:11px;background:#3e8e2f;color:#fff;border-radius:50%;width:18px;height:18px;line-height:18px;text-align:center;margin-left:6px;text-shadow:none;vertical-align:2px}
#channel-view .ch-avatar{border-radius:0;border:3px solid #000}
#channel-view .ch-avatar img{border-radius:0}
#channel-view .ch-name{color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:1px}
#channel-view .ch-back{background:linear-gradient(180deg,#9a9a9a,#6f6f6f);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(0,0,0,.45);color:#fff !important;text-shadow:2px 2px 0 #383838;padding:6px 14px;font-weight:bold;margin-bottom:12px}
#channel-view .ch-tabs button{background:linear-gradient(180deg,#9a9a9a,#6f6f6f);border:2px solid #000 !important;border-radius:0 !important;color:#fff;text-shadow:2px 2px 0 #383838}
#channel-view .ch-tabs button:first-child{border-right:none !important}
#channel-view .ch-subbtn{display:block;text-align:center;background:linear-gradient(180deg,#c44,#922);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.45);color:#fff !important;text-decoration:none;font:bold 13px monospace;text-shadow:2px 2px 0 #300;padding:8px;margin-bottom:10px}
#channel-view .ch-subbtn:active{background:linear-gradient(180deg,#e55,#a33)}
#channel-view .ch-tabs button.on{background:linear-gradient(180deg,#5fae3f,#3e8e2f)}
#channel-view .result-item{background:#2b2b31;border:2px solid #000;border-radius:2px}
#channel-view .r-thumb{border-radius:0;border:2px solid #000}
#channel-view .r-avatar{border-radius:0;border:2px solid #000}
#channel-view .r-avatar img{border-radius:0}
#channel-view .r-title{text-shadow:1px 1px 0 #000}
#channel-view .ch-desc{background:rgba(0,0,0,.35);border:2px solid #000;padding:8px;color:#c9c9c9}
#channel-view .pl-card{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:8px;margin-bottom:8px;background:#2b2b31;border:2px solid #000;border-radius:2px;cursor:pointer}
#channel-view .pl-card:active{background:#3a3a44}
#channel-view .pl-thumb{width:112px;min-width:112px;height:64px;background:#111;overflow:hidden;position:relative;-webkit-flex-shrink:0;flex-shrink:0;margin-right:10px}
#channel-view .pl-thumb img{width:100%;height:100%}
#channel-view .pl-thumb .cnt{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.72);color:#fff;font-size:10px;padding:2px 4px;text-align:center}
#channel-view .pl-name{font-size:13px;font-weight:bold;color:#fff;line-height:1.3;text-shadow:1px 1px 0 #000}
#channel-view .pl-open{font-size:11px;color:#8af;margin-top:2px}
/* Shorts theater (modern browsers): fullscreen vertical player */
#theater{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:50;padding:10px 12px 16px}
.th-top{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:8px}
.th-count{font-size:11px;color:#888;margin-right:10px;white-space:nowrap}
.th-title{-webkit-flex:1;flex:1;font:bold 13px monospace;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.th-x{font:bold 16px monospace;color:#fff;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:6px;padding:6px 12px;cursor:pointer}
.th-stage{position:relative;width:100%;height:62vh;background:#111;border-radius:10px;overflow:hidden;margin-bottom:8px}
.th-stage iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.th-load{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);font-size:12px;color:#888}
.th-author{font-size:12px;color:#aaa;margin-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-nav{display:-webkit-box;display:-webkit-flex;display:flex}
.th-nav button{-webkit-flex:1;flex:1;padding:16px;font:bold 15px monospace;background:rgba(24,24,48,.9);border:1px solid rgba(120,120,180,.35);color:#fff;cursor:pointer}
.th-nav button:first-child{border-radius:8px 0 0 8px;border-right:none}
.th-nav button:last-child{border-radius:0 8px 8px 0}
.th-nav button:active{background:rgba(40,40,80,.9)}
.ch-card{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px;margin-bottom:8px;background:rgba(30,26,50,.7);border:1px solid rgba(180,120,80,.3);border-radius:8px;cursor:pointer}
.ch-card:active{background:rgba(50,40,80,.8)}
.ch-card-av{width:52px;height:52px;border-radius:50%;background:#222;overflow:hidden;-webkit-flex-shrink:0;flex-shrink:0;margin-right:12px}
.ch-card-av img{width:100%;height:100%;border-radius:50%}
.ch-card-name{font-size:14px;font-weight:bold;color:#fff;line-height:1.3}
.ch-card-sub{font-size:11px;color:#8af;margin-top:2px}
.ch-card-desc{font-size:11px;color:#777;margin-top:2px;max-height:28px;overflow:hidden;line-height:1.3}
.results{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.result-item{display:-webkit-box;display:-webkit-flex;display:flex;padding:12px;margin-bottom:12px;background:rgba(20,20,40,.7);border:1px solid rgba(90,90,140,.18);border-radius:10px;cursor:pointer}
.result-item:active{background:rgba(40,40,80,.75);border-color:rgba(200,80,80,.4)}
.r-thumb{width:168px;min-width:168px;height:94px;background:#111;border-radius:6px;overflow:hidden;position:relative;-webkit-flex-shrink:0;flex-shrink:0}
.r-thumb img{width:100%;height:100%}
.r-thumb .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.82);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}
.r-body{display:-webkit-box;display:-webkit-flex;display:flex;min-width:0;-webkit-flex:1;flex:1}
.r-avatar{width:36px;height:36px;border-radius:50%;background:#222;-webkit-flex-shrink:0;flex-shrink:0;overflow:hidden;margin-top:2px;margin-right:10px}
.r-avatar img{width:100%;height:100%;border-radius:50%}
.r-info{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;-webkit-flex:1;flex:1}
.r-title{font-size:13px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r-channel{font-size:11px;color:#aaa;line-height:1.3}
.r-channel .vbadge{font-size:9px;background:rgba(255,255,255,.12);padding:0 4px;border-radius:3px;margin-left:3px;color:#ccc}
.r-stats{font-size:11px;color:#777;line-height:1.3}
.empty{text-align:center;padding:40px 0;color:#666;font-size:13px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#555}
@media(max-width:600px){
  .r-thumb{width:120px;min-width:120px;height:68px}
  .r-title{font-size:12px}
  .r-avatar{width:28px;height:28px}
  .np-avatar{width:28px;height:28px}
  .preview-overlay .play-btn{width:52px;height:52px}
  .preview-overlay .play-btn::after{border-width:10px 0 10px 18px;margin-left:3px}
  .skel .sb-t{width:96px;min-width:96px;height:56px}
  .topbar .logo{font-size:19px}
}
.filters{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:12px}
.filters select{-webkit-flex:1;flex:1;min-width:0;padding:10px 6px;margin-right:8px;font:13px monospace;background:rgba(20,20,40,.9);border:1px solid rgba(120,120,180,.35);border-radius:8px;color:#ccc;outline:none}
.filters select:last-child{margin-right:0}
.filters select:active{background:rgba(40,40,80,.9)}
.sec-title{font:bold 14px monospace;color:#fff;margin:14px 0 10px;padding-left:10px;border-left:3px solid #f44}
.sec-title span{font-size:11px;color:#888;font-weight:normal}
.np-actions{display:-webkit-box;display:-webkit-flex;display:flex;margin-top:12px}
.np-actions button{-webkit-flex:1;flex:1;padding:12px 4px;margin-right:10px;font:bold 13px monospace;background:rgba(50,55,100,.55);border:1px solid rgba(120,140,220,.35);border-radius:8px;color:#dfe6ff;cursor:pointer}
.np-actions button:last-child{margin-right:0}
.np-actions button:active{background:rgba(80,95,160,.8)}
.np-actions button.saved{border-color:rgba(95,174,63,.7);color:#bfe6b0}
.loadmore{display:block;width:100%;padding:14px;margin:6px 0 14px;font:bold 13px monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);border-radius:10px;color:#ccc;cursor:pointer}
.loadmore:active{background:rgba(40,40,80,.9)}
.loadmore:disabled{opacity:.45}
.skel{border-radius:8px;margin-bottom:8px;background:rgba(30,30,55,.7);border:1px solid rgba(90,90,140,.15);padding:8px;display:-webkit-box;display:-webkit-flex;display:flex}
.skel .sb-t{width:120px;min-width:120px;height:68px;border-radius:6px;background:rgba(120,120,180,.14);margin-right:10px;-webkit-animation:pulse 1.1s ease-in-out infinite;animation:pulse 1.1s ease-in-out infinite}
.skel .sb-b{-webkit-flex:1;flex:1}
.skel .sb-l1{height:13px;border-radius:4px;background:rgba(120,120,180,.16);margin:4px 0 8px;-webkit-animation:pulse 1.1s ease-in-out infinite;animation:pulse 1.1s ease-in-out infinite}
.skel .sb-l2{height:10px;width:60%;border-radius:4px;background:rgba(120,120,180,.12);-webkit-animation:pulse 1.1s ease-in-out infinite;animation:pulse 1.1s ease-in-out infinite}
@-webkit-keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.result-item{position:relative}
.rm{position:absolute;top:6px;right:6px;width:24px;height:24px;font:bold 13px/22px monospace;text-align:center;color:#f88;background:rgba(0,0,0,.55);border:1px solid rgba(255,100,100,.4);border-radius:50%;cursor:pointer}
.rm:active{background:rgba(180,40,40,.8);color:#fff}
/* Snap-scroll Shorts feed */
.snapfeed{height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#000;border-radius:10px;scroll-snap-type:y mandatory;border:1px solid rgba(120,120,180,.25)}
.snap-slide{position:relative;height:72vh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;cursor:pointer}
.snap-slide img{position:absolute;top:0;left:0;width:100%;height:100%;-o-object-fit:cover;object-fit:cover}
.snap-slide iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.snap-play{position:absolute;top:50%;left:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(200,45,45,.9);box-shadow:0 2px 16px rgba(0,0,0,.6)}
.snap-play::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;margin:-12px 0 0 -8px;border-style:solid;border-width:12px 0 12px 22px;border-color:transparent transparent transparent #fff}
.snap-load{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);font-size:12px;color:#bbb;text-shadow:0 1px 2px #000;z-index:3}
.snap-cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:2}
.snap-title{font:bold 13px/1.35 monospace;color:#fff;overflow:hidden;max-height:36px}
.snap-author{font-size:11px;color:#bbb;margin-top:3px}
</style>

<body>
<div class="wrap">
  <div class="topbar">
    <span class="logo"><span>YT</span> Forge</span>
    <a class="back" href="../games.html?v=2">&larr; Games</a>
  </div>

  <div class="menu-row" id="menu-row">
    <button id="menu-home" class="on">Home</button>
    <button id="menu-shorts">Shorts</button>
    <button id="menu-saved">Saved</button>
  </div>

  <div class="search-row">
    <input id="q" type="search" placeholder="Search YouTube..." autocomplete="off">
    <button id="btn-search">Search</button>
  </div>
  <div class="filters" id="filters">

<script>
(function(){
  var API = 'https://blockforge-server.onrender.com/api/yt-search';
  var API_CH = 'https://blockforge-server.onrender.com/api/yt-channel';
  var API_EMBED = 'https://blockforge-server.onrender.com/api/yt-embed';
  var YTS = 'https://www.youtube.com/results?search_query=';
  var playerBox = document.getElementById('player-box');
  var previewOverlay = document.getElementById('preview-overlay');
  var previewThumb = document.getElementById('preview-thumb');
  var previewTitle = document.getElementById('preview-title');
  var previewHint = document.getElementById('preview-hint');
  var playBtn = document.getElementById('play-btn');
  var playerLoader = document.getElementById('player-loader');
  var blockMsg = document.getElementById('block-msg');
  var blockText = document.getElementById('block-text');
  var linkYt = document.getElementById('link-yt');
  var classicframe = document.getElementById('classicframe');
  var resultsEl = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var dbgEl = document.getElementById('dbg');
  var qInput = document.getElementById('q');
  var btnSearch = document.getElementById('btn-search');
  var fSort = document.getElementById('f-sort');
  var fDate = document.getElementById('f-date');
  var fDur = document.getElementById('f-dur');
  var loadmoreBtn = document.getElementById('loadmore');
  var curQuery = '';
  var curPage = 1;
  var seenIds = {};
  var upnextCache = {};
  var npWrap = document.getElementById('now-playing');
  var npTitle = document.getElementById('np-title');
  var npChannel = document.getElementById('np-channel');
  var npStats = document.getElementById('np-stats');
  var ytLinkEl = document.getElementById('yt-link');
  var searchLinksEl = document.getElementById('search-links');
  var menuHome = document.getElementById('menu-home');
  var menuShorts = document.getElementById('menu-shorts');
  var menuSaved = document.getElementById('menu-saved');
  var savedView = document.getElementById('saved-view');
  var savedList = document.getElementById('saved-list');
  var recentSec = document.getElementById('recent-sec');
  var recentList = document.getElementById('recent-list');
  var upnextSec = document.getElementById('upnext-sec');
  var upnextList = document.getElementById('upnext-list');
  var upnextFrom = document.getElementById('upnext-from');
  var btnSave = document.getElementById('btn-save');
  var btnShare = document.getElementById('btn-share');
  var btnFull = document.getElementById('btn-full');
  var curWatchUrl = '';
  var channelView = document.getElementById('channel-view');
  var shortsView = document.getElementById('shorts-view');
  var chAvatar = document.getElementById('ch-avatar');
  var chBanner = document.getElementById('ch-banner');
  var chSub = document.getElementById('ch-sub');
  var chName = document.getElementById('ch-name');
  var chSubs = document.getElementById('ch-subs');
  var chDesc = document.getElementById('ch-desc');
  var chBack = document.getElementById('ch-back');
  var chTabVideos = document.getElementById('ch-tab-videos');
  var chTabShorts = document.getElementById('ch-tab-shorts');
  var chTabPlaylists = document.getElementById('ch-tab-playlists');
  var plListHtml = '';
  var plTitles = {};
  var chList = document.getElementById('ch-list');
  var shortsFeed = document.getElementById('shorts-feed');
  var curChId = '';
  var curChName = '';
  var curChAvatar = '';
  var chVideosHtml = '';
  var shortsLoaded = false;
  var shortsLoadedAt = 0;
  function refreshShorts() {
    if (shortsLoaded && (Date.now() - shortsLoadedAt < 600000)) { showView('shorts'); return; }
    shortsLoaded = false;
    loadMenuShorts();
  }

  var curView = 'home';

  function showView(name) {
    curView = name;
    try { closeTheater(); } catch (e) {}
    try {
      var dead = document.querySelectorAll('.snap-slide iframe');
      for (var di = 0; di < dead.length; di++) {
        var sl = dead[di].parentNode;
        try { dead[di].src = ''; } catch (e2) {}
        if (sl) sl.removeChild(dead[di]);
        if (sl) sl.removeAttribute('data-loaded');
      }
    } catch (e3) {}
    resultsEl.style.display = name === 'home' ? 'flex' : 'none';
    channelView.style.display = name === 'channel' ? 'block' : 'none';
    shortsView.style.display = name === 'shorts' ? 'block' : 'none';
    savedView.style.display = name === 'saved' ? 'block' : 'none';
    menuHome.className = name === 'home' ? 'on' : '';
    menuShorts.className = name === 'shorts' ? 'on' : '';
    menuSaved.className = name === 'saved' ? 'on' : '';
    if (name === 'saved') renderSaved();
    if (name === 'home') renderRecent();
  }

  var currentVid = '';
  var curLenSec = '';
  var curType = '';
  var attemptTimer = null;

  // Legacy mode: YouTube's 2026 embed bundle no longer executes on
  // Safari <= 10 (all hosts/params load but render black — verified on
  // device across 10 videos). Those browsers hand off to mobile YouTube
  // in the same tab instead; the back button returns to YT Forge.
  var IS_LEGACY = (function() {
    try {
      var ua = navigator.userAgent || '';
      var m = ua.match(/OS (\d+)_/);
      if (/iPhone|iPad|iPod/.test(ua) && m && parseInt(m[1], 10) <= 10) return true;
      var v = ua.match(/Version\/(\d+)\./);
      if (/Safari/.test(ua) && !/Chrome|CriOS/.test(ua) && v && parseInt(v[1], 10) <= 10) return true;
    } catch (e) {}
    return false;
  })();

  function storeGet(k) {
    try {
      var raw = window.localStorage ? localStorage.getItem(k) : null;
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function storeSet(k, v) {
    try { if (window.localStorage) localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }

  var curAuthor = '';
  var curAuthorId = '';

  function pushHist(it) {
    var h = storeGet('ytf_hist') || [];
    var out = [];
    for (var i = 0; i < h.length; i++) if (h[i].id !== it.id) out.push(h[i]);
    out.unshift(it);
    if (out.length > 30) out.length = 30;
    storeSet('ytf_hist', out);
  }

  function histItemHtml(it) {
    return itemHtml({
      vid: it.id,
      title: esc(it.title || 'Untitled'),
      author: esc(it.author || ''),
      authorRaw: it.author || '',
      authorId: it.authorId || '',
      rawViews: '',
      published: '',
      viewsLabel: '',
      durLabel: '',
      lenSec: it.lenSec || '',
      vtype: it.vtype || '',
      verified: false,
      thumb: ytThumb(it.id),
      avatarUrl: ''
    });
  }

  function renderRecent() {
    var h = storeGet('ytf_hist') || [];
    var hasResults = false;
    try { hasResults = !!resultsEl.querySelector('.result-item'); } catch (e) {}
    if (!h.length || hasResults || curView !== 'home') { recentSec.style.display = 'none'; return; }
    var html = '';
    for (var i = 0; i < Math.min(h.length, 6); i++) html += histItemHtml(h[i]);
    recentList.innerHTML = html;
    bindItems(recentList);
    recentSec.style.display = 'block';
  }

  function getSaved() { return storeGet('ytf_list') || []; }
  function isSaved(id) {
    var l = getSaved();
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return true;
    return false;
  }
  function paintSaveBtn() {
    var s = isSaved(currentVid);
    btnSave.textContent = s ? '✓ Saved' : '＋ Save';
    btnSave.className = s ? 'saved' : '';
  }
  function removeSaved(id) {
    var l = getSaved();
    var out = [];
    for (var i = 0; i < l.length; i++) if (l[i].id !== id) out.push(l[i]);
    storeSet('ytf_list', out);
    paintSaveBtn();
    if (curView === 'saved') renderSaved();
  }
  function renderSaved() {
    var l = getSaved();
    if (!l.length) {
      savedList.innerHTML = '<div class="empty"><span class="big">🔖</span>Nothing saved yet.<br>Open any video and tap ＋ Save.</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < l.length; i++) html += histItemHtml(l[i]);
    savedList.innerHTML = html;
    bindItems(savedList);
    var rows = savedList.querySelectorAll('.result-item');
    for (var j = 0; j < rows.length; j++) {
      if (j >= l.length) break;
      var rm = document.createElement('span');
      rm.className = 'rm';
      rm.textContent = '×';
      rm.setAttribute('data-rm', l[j].id);
      rows[j].appendChild(rm);
    }
  }
  function tapIsRm(el, e) {
    var t = e.target;
    while (t && t !== el) {
      if (t.getAttribute && t.getAttribute('data-rm')) return t.getAttribute('data-rm');
      t = t.parentNode;
    }
    return null;
  }

  function setStatus(msg) { statusEl.textContent = msg; }

  function dbg(msg) {
    var t = dbgEl.textContent;
    t = t ? (t + ' · ' + msg) : msg;
    if (t.length > 400) t = t.slice(t.length - 400);
    dbgEl.textContent = t;
  }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML.replace(/"/g, '&quot;');
  }

  function fmtNum(n) {
    if (n == null) return '';
    n = parseInt(n, 10);
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function fmtDuration(s) {
    if (!s) return '';
    s = parseInt(s, 10);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function ytThumb(vid) {
    return 'https://i.ytimg.com/vi/' + vid + '/hqdefault.jpg';
  }

  function ytChannelThumb(thumbs) {
    if (!thumbs || !thumbs.length) return '';
    for (var i = 0; i < thumbs.length; i++) {
      if (thumbs[i].width >= 76) return thumbs[i].url;
    }
    return thumbs[thumbs.length - 1].url;
  }

  function clearTimer() {
    if (attemptTimer) { clearTimeout(attemptTimer); attemptTimer = null; }
  }

  function resetPlayer() {
    clearTimer();
    classicframe.src = '';
    classicframe.style.display = 'none';
    playerLoader.style.display = 'none';
    blockMsg.style.display = 'none';
    previewOverlay.style.display = 'none';
  }

  function showFail(msg) {
    clearTimer();
    classicframe.src = '';
    classicframe.style.display = 'none';
    playerLoader.style.display = 'none';
    previewOverlay.style.display = 'none';
    blockText.textContent = msg || "Video wouldn't play.";
    blockMsg.style.display = 'flex';
    dbg('fail');
  }

  function loadStream(id) {
    // Legacy browsers: hand off to mobile YouTube in the SAME tab.
    // Back button returns to YT Forge — hub loop stays intact.
    if (IS_LEGACY) {
      dbg('handoff myt');
      setStatus('Opening YouTube...');
      var shortHandoff = isShortCtx(curType, curLenSec);
      location.href = shortHandoff
        ? 'https://www.youtube.com/shorts/' + id
        : 'https://m.youtube.com/watch?v=' + id;
      return;
    }
    // Primary path (proven on iOS 10): classic nocookie embed, autoplay
    // OFF so the in-iframe tap is a fresh user gesture, real controls.
    dbgEl.textContent = '';
    dbg('play ' + id);
    resetPlayer();
    playerBox.style.display = 'block';
    loadClassic();
  }

  // Embed configs under test on old Safari. MIN = closest to anything
  // that ever painted UI (www host, bare params, no origin).
  var EMBED_CFG = {
    min: { host: 'https://www.youtube.com/embed/', params: '?autoplay=0&controls=1&playsinline=1&rel=0' }
  };

  function loadClassic() {
    var id = currentVid;
    var ec = EMBED_CFG.min;
    dbg('classic...');
    clearTimer();
    blockMsg.style.display = 'none';
    classicframe.style.display = 'none';
    playerLoader.style.display = 'block';
    setStatus('Checking video...');
    // Fail fast when the owner disabled embedding — oEmbed 200 means
    // playable. Fail-open: any check error still tries the player.
    var xhr = new XMLHttpRequest();
    var checked = false;
    function startClassic() {
      if (checked) return;
      checked = true;
      classicframe.style.display = 'block';
      setStatus('Loading classic player...');
      classicframe.onload = function() {
        dbg('classic loaded');
        playerLoader.style.display = 'none';
        setStatus('Tap play inside the player.');
        classicframe.onload = null;
      };
    classicframe.src = ec.host + id + ec.params;
      attemptTimer = setTimeout(function() {
        if (playerLoader.style.display !== 'none') {
          dbg('classic stall');
          playerLoader.style.display = 'none';
          showFail('Classic player stalled. Use the Watch link below — it always works.');
          setStatus('');
        }
      }, 20000);
    }
    xhr.open('GET', API_EMBED + '?v=' + encodeURIComponent(id), true);
    xhr.timeout = 8000;
    xhr.onload = function() {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var d = JSON.parse(xhr.responseText);
          if (d && d.embeddable === false) {
            dbg('embed-disabled');
            playerLoader.style.display = 'none';
            showFail('The owner disabled embedding for this video. Use the YouTube links below — they always work.');
            setStatus('');
            return;
          }
        } catch (e) {}
      }
      startClassic();
    };
    xhr.onerror = function() { startClassic(); };
    xhr.ontimeout = function() { startClassic(); };
    xhr.send();
  }

  var theater = document.getElementById('theater');
  var thStage = document.getElementById('th-stage');
  var thTitle = document.getElementById('th-title');
  var thAuthor = document.getElementById('th-author');
  var thCount = document.getElementById('th-count');
  var thClose = document.getElementById('th-close');
  var thPrev = document.getElementById('th-prev');
  var thNext = document.getElementById('th-next');
  var thQueue = [];
  var thIdx = 0;

  function isShortCtx(vtype, lenSec) {
    if (vtype === 'short') return true;
    if (lenSec && parseInt(lenSec, 10) <= 62) return true;
    return false;
  }

  function openTheaterFrom(el) {
    var box = el.parentNode;
    var nodes = box.querySelectorAll('.result-item');
    var q = [];
    var pos = 0;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (!isShortCtx(n.getAttribute('data-type'), n.getAttribute('data-len'))) continue;
      if (n === el) pos = q.length;
      q.push({
        vid: n.getAttribute('data-vid'),
        title: n.getAttribute('data-title'),
        author: n.getAttribute('data-author'),
        authorId: n.getAttribute('data-authorid')
      });
    }
    if (!q.length) return false;
    openTheater(q, pos);
    return true;
  }

  function openTheater(list, idx) {
    thQueue = list;
    thIdx = idx || 0;
    theater.style.display = 'block';
    try { document.body.style.overflow = 'hidden'; } catch (e) {}
    paintTheater();
  }

  function closeTheater() {
    theater.style.display = 'none';
    thStage.innerHTML = '';
    thQueue = [];
    try { document.body.style.overflow = ''; } catch (e) {}
  }

  function paintTheater() {
    var it = thQueue[thIdx];
    if (!it) return;
    thTitle.innerHTML = it.title || '';
    thAuthor.innerHTML = '<span class="chn-link" data-ch="' + esc(it.authorId || '') + '">' + (it.author || '') + '</span>';
    thCount.textContent = (thIdx + 1) + ' / ' + thQueue.length;
    thStage.innerHTML = '<div class="th-load">Loading...</div>';
    var fr = document.createElement('iframe');
    fr.setAttribute('webkitallowfullscreen', '');
    fr.setAttribute('allowfullscreen', 'allowfullscreen');
    fr.setAttribute('playsinline', 'playsinline');
    fr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    fr.onload = function() {
      var l = thStage.querySelector('.th-load');
      if (l) l.style.display = 'none';
      fr.onload = null;
    };
    fr.src = EMBED_CFG.min.host + it.vid + EMBED_CFG.min.params;
    thStage.appendChild(fr);
  }

  thClose.addEventListener('click', function() { closeTheater(); });
  thPrev.addEventListener('click', function() {
    if (!thQueue.length) return;
    thIdx = (thIdx - 1 + thQueue.length) % thQueue.length;
    paintTheater();
  });
  thNext.addEventListener('click', function() {
    if (!thQueue.length) return;
    thIdx = (thIdx + 1) % thQueue.length;
    paintTheater();
  });
  thAuthor.addEventListener('click', function(e) {
    var t = e.target;
    while (t && t !== thAuthor) {
      if (t.getAttribute && t.getAttribute('data-ch')) {
        closeTheater();
        openChannel(t.getAttribute('data-ch'));
        return;
      }
      t = t.parentNode;
    }
  });

  playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    loadStream(currentVid);
  });
  previewOverlay.addEventListener('click', function() {
    loadStream(currentVid);
  });

  function showPreview(id, title, author, authorId, viewCount, lenSec, vtype) {
    currentVid = id;
    curLenSec = lenSec || '';
    curType = vtype || '';
    curAuthor = author || '';
    curAuthorId = authorId || '';
    var shortCtx = isShortCtx(vtype, lenSec);
    var watchUrl = shortCtx
      ? 'https://www.youtube.com/shorts/' + id
      : 'https://www.youtube.com/watch?v=' + id;
    curWatchUrl = watchUrl;
    pushHist({ id: id, title: title || '', author: author || '', authorId: authorId || '', lenSec: lenSec || '', vtype: vtype || '' });
    paintSaveBtn();
    loadUpNext(authorId, author);
    resetPlayer();
    previewThumb.style.display = '';
    previewThumb.src = ytThumb(id);
    previewTitle.textContent = title || '';
    previewHint.textContent = IS_LEGACY ? 'Tap to watch on YouTube' : 'Tap to play';
    previewOverlay.style.display = 'flex';
    playerBox.style.display = 'block';

    linkYt.href = watchUrl;

    npTitle.textContent = title || '';
    var channelHtml = '<div class="np-channel-name"><span class="chn-link" data-ch="' + esc(authorId || '') + '">' + esc(author || 'Unknown') + '</span></div>';
    if (authorId) channelHtml += '<div class="np-subs"><a href="https://youtube.com/channel/' + authorId + '" target="_blank" style="color:#8af;text-decoration:none">Visit channel &#x2197;</a></div>';
    npChannel.innerHTML = channelHtml;
    var statsHtml = '';
    if (viewCount) statsHtml = fmtNum(viewCount) + ' views';
    npStats.innerHTML = statsHtml;
    npWrap.style.display = 'block';

    ytLinkEl.innerHTML = '<a href="' + watchUrl + '" target="_blank">' + (shortCtx ? 'Open short on YouTube &#x2197;' : 'Watch on YouTube &#x2197;') + '</a>';
    ytLinkEl.style.display = 'block';

    setStatus('');
    window.scrollTo(0, 0);
  }

  function itemHtml(o) {
    var metaLine = '';
    if (o.author) {
      metaLine += '<span class="r-channel"><span class="chn-link" data-ch="' + esc(o.authorId) + '">' + o.author + '</span>';
      if (o.verified) metaLine += ' <span class="vbadge">&#x2713;</span>';
      metaLine += '</span>';
    }
    if (o.published) metaLine += '<span class="r-stats"> &middot; ' + o.published + '</span>';
    if (o.viewsLabel) metaLine += '<span class="r-stats"> &middot; ' + o.viewsLabel + '</span>';

    return '<div class="result-item" data-vid="' + esc(o.vid) + '"'
      + ' data-title="' + (o.title || '') + '"'
      + ' data-author="' + esc(o.authorRaw || '') + '"'
      + ' data-authorid="' + esc(o.authorId) + '"'
      + ' data-views="' + (o.rawViews || '') + '"'
      + ' data-len="' + (o.lenSec || '') + '"'
      + ' data-type="' + esc(o.vtype || '') + '"'
      + '>'
      + '<div class="r-thumb">'
      + '<img src="' + o.thumb + '" alt="" onerror="this.style.display=\'none\'">'
      + (o.durLabel ? '<span class="dur">' + o.durLabel + '</span>' : '')
      + '</div>'
      + '<div class="r-body">'
      + (o.avatarUrl ? '<div class="r-avatar"><img src="' + esc(o.avatarUrl) + '" alt="" onerror="this.style.display=\'none\'"></div>' : '')
      + '<div class="r-info">'
      + '<div class="r-title">' + o.title + '</div>'
      + metaLine
      + '</div></div></div>';
  }

  function channelCardHtml(c) {
    var av = ytChannelThumb(c.authorThumbnails);
    var desc = c.descriptionSnippet || c.description || '';
    return '<div class="ch-card" data-ch="' + esc(c.authorId || '') + '">'
      + (av ? '<div class="ch-card-av"><img src="' + esc(av) + '" alt="" onerror="this.style.display=\'none\'"></div>' : '')
      + '<div><div class="ch-card-name">' + esc(c.author || 'Unknown') + '</div>'
      + '<div class="ch-card-sub">' + (c.subCount != null ? fmtNum(c.subCount) + ' subscribers &middot; ' : '') + 'View channel &#8250;</div>'
      + (desc ? '<div class="ch-card-desc">' + esc(String(desc).slice(0, 120)) + '</div>' : '')
      + '</div></div>';
  }

  function skelHtml() {
    var h = '';
    for (var i = 0; i < 3; i++) {
      h += '<div class="skel"><div class="sb-t"></div><div class="sb-b"><div class="sb-l1"></div><div class="sb-l2"></div></div></div>';
    }
    return h;
  }

  function noteSeen(items) {
    for (var i = 0; items && i < items.length; i++) {
      if (items[i].videoId) seenIds['v' + items[i].videoId] = 1;
      if (items[i].authorId) seenIds['c' + items[i].authorId] = 1;
    }
  }

  function searchUrl(q, page) {
    var u = API + '?q=' + encodeURIComponent(q);
    if (fSort.value) u += '&sort_by=' + fSort.value;
    if (fDate.value) u += '&date=' + fDate.value;
    if (fDur.value) u += '&duration=' + fDur.value;
    if (page > 1) u += '&page=' + page;
    return u;
  }

  function fetchSearch(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) { cb('Server error (' + xhr.status + ')'); return; }
      try { cb(null, JSON.parse(xhr.responseText)); }
      catch (e) { cb('Bad response from server'); }
    };
    xhr.onerror = function() { cb('Network error'); };
    xhr.ontimeout = function() { cb('Timed out'); };
    xhr.send();
  }

  function appendResults(items) {
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var v = items[i];
      if (v.type === 'channel') {
        if (v.authorId && !seenIds['c' + v.authorId]) html += channelCardHtml(v);
        continue;
      }
      if (v.type === 'playlist' || v.type === 'hashtag') continue;
      if (!v.videoId || seenIds['v' + v.videoId]) continue;
      html += itemHtml({
        vid: v.videoId,
        title: esc(v.title || 'Untitled'),
        author: esc(v.author || ''),
        authorRaw: v.author || '',
        authorId: v.authorId || '',
        rawViews: v.viewCount || '',
        published: esc(v.publishedText || ''),
        viewsLabel: v.viewCount ? fmtNum(v.viewCount) + ' views' : '',
        durLabel: v.lengthSeconds ? fmtDuration(v.lengthSeconds) : '',
        lenSec: v.lengthSeconds || '',
        vtype: v.type || '',
        verified: v.authorVerified,
        thumb: ytThumb(v.videoId),
        avatarUrl: ytChannelThumb(v.authorThumbnails)
      });
    }
    noteSeen(items);
    return html;
  }

  function renderResults(items) {
    if (!items || items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">No results found</div>';
      loadmoreBtn.style.display = 'none';
      return;
    }
    var html = appendResults(items);
    if (!html) {
      resultsEl.innerHTML = '<div class="empty">No video results found</div>';
      loadmoreBtn.style.display = 'none';
      return;
    }
    resultsEl.innerHTML = html;
    bindItems(resultsEl);
    loadmoreBtn.style.display = 'block';
    loadmoreBtn.disabled = false;
    loadmoreBtn.textContent = 'Load more';
  }

  function loadMore() {
    if (!curQuery) return;
    loadmoreBtn.disabled = true;
    loadmoreBtn.textContent = 'Loading...';
    fetchSearch(searchUrl(curQuery, curPage + 1), function(err, data) {
      if (err || !data || !data.length) {
        loadmoreBtn.style.display = 'none';
        setStatus(err || '');
        return;
      }
      curPage++;
      var html = appendResults(data);
      if (!html) {
        loadmoreBtn.style.display = 'none';
        setStatus('No more results.');
        return;
      }
      var tmp = document.createElement('div');
      tmp.innerHTML = html;
      while (tmp.firstChild) resultsEl.appendChild(tmp.firstChild);
      bindItems(resultsEl);
      loadmoreBtn.disabled = false;
      loadmoreBtn.textContent = 'Load more';
      setStatus('');
    });
  }

  function bindChannelCard(el) {
    if (el._yfb) return;
    el._yfb = 1;
    var sy = 0;
    var moved = false;
    function go(e) {
      e.preventDefault();
      var id = el.getAttribute('data-ch');
      if (id) openChannel(id);
    }
    el.addEventListener('touchstart', function(e) {
      sy = e.touches[0].clientY;
      moved = false;
    });
    el.addEventListener('touchmove', function(e) {
      if (Math.abs(e.touches[0].clientY - sy) > 10) moved = true;
    });
    el.addEventListener('click', go);
    el.addEventListener('touchend', function(e) {
      if (moved) return;
      go(e);
    });
  }

  function tapIsChannel(el, e) {
    var t = e.target;
    while (t && t !== el) {
      if (t.getAttribute && t.getAttribute('data-ch')) return t.getAttribute('data-ch');
      t = t.parentNode;
    }
    return null;
  }

  function bindItems(box) {
    var items = box.querySelectorAll('.result-item');
    for (var j = 0; j < items.length; j++) bindResult(items[j]);
    var cards = box.querySelectorAll('.ch-card');
    for (var k = 0; k < cards.length; k++) bindChannelCard(cards[k]);
  }

  function shortItemHtml(v, authorName, authorId, avatarUrl) {
    return itemHtml({
      vid: v.videoId,
      title: esc(v.title || 'Untitled'),
      author: esc(authorName || v.author || ''),
      authorRaw: authorName || v.author || '',
      authorId: authorId || v.authorId || '',
      rawViews: v.viewCount || '',
      published: esc(v.publishedText || ''),
      viewsLabel: v.viewCount ? fmtNum(v.viewCount) + ' views' : '',
      durLabel: v.lengthSeconds ? fmtDuration(v.lengthSeconds) : '',
      lenSec: v.lengthSeconds || '',
      vtype: v.type || 'short',
      verified: v.authorVerified,
      thumb: ytThumb(v.videoId),
      avatarUrl: avatarUrl || ytChannelThumb(v.authorThumbnails)
    });
  }

  function bindResult(el) {
    if (el._yfb) return;
    el._yfb = 1;
    var sy = 0;
    var moved = false;
    el.addEventListener('touchstart', function(e) {
      sy = e.touches[0].clientY;
      moved = false;
    }, true);
    el.addEventListener('touchmove', function(e) {
      if (Math.abs(e.touches[0].clientY - sy) > 10) moved = true;
    }, true);
    el.addEventListener('click', function(e) {
      e.preventDefault();
      var rmid = tapIsRm(el, e);
      if (rmid) { removeSaved(rmid); return; }
      var chid = tapIsChannel(el, e);
      if (chid) { openChannel(chid); return; }
      if (!IS_LEGACY && isShortCtx(el.getAttribute('data-type'), el.getAttribute('data-len'))) {
        if (openTheaterFrom(el)) return;
      }
      showPreview(
        el.getAttribute('data-vid'),
        el.getAttribute('data-title'),
        el.getAttribute('data-author'),
        el.getAttribute('data-authorid'),
        el.getAttribute('data-views'),
        el.getAttribute('data-len'),
        el.getAttribute('data-type')
      );
    });
    el.addEventListener('touchend', function(e) {
      if (moved) return;
      e.preventDefault();
      var rmid = tapIsRm(el, e);
      if (rmid) { removeSaved(rmid); return; }
      var chid = tapIsChannel(el, e);
      if (chid) { openChannel(chid); return; }
      if (!IS_LEGACY && isShortCtx(el.getAttribute('data-type'), el.getAttribute('data-len'))) {
        if (openTheaterFrom(el)) return;
      }
      showPreview(
        el.getAttribute('data-vid'),
        el.getAttribute('data-title'),
        el.getAttribute('data-author'),
        el.getAttribute('data-authorid'),
        el.getAttribute('data-views'),
        el.getAttribute('data-len'),
        el.getAttribute('data-type')
      );
    });
  }

  function openChannel(authorId) {
    if (!authorId) return;
    curChId = authorId;
    curChName = '';
    curChAvatar = '';
    chVideosHtml = '';
    plListHtml = '';
    plTitles = {};
    showView('channel');
    chName.textContent = 'Loading...';
    chSubs.textContent = '';
    chDesc.textContent = '';
    chAvatar.src = '';
    chAvatar.style.display = '';
    chBanner.removeAttribute('src');
    chBanner.style.display = 'none';
    chSub.href = '#';
    chSub.style.display = 'none';
    chList.innerHTML = '';
    chList.style.display = 'block';
    chSetTab('videos');
    setStatus('Loading channel...');
    window.scrollTo(0, 0);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_CH + '?channelId=' + encodeURIComponent(authorId) + '&tab=info', true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) { setStatus('Channel failed to load'); return; }
      var d;
      try { d = JSON.parse(xhr.responseText); } catch (e) { setStatus('Channel failed to load'); return; }
      if (d.error) { setStatus('Channel failed to load'); return; }
      chName.innerHTML = esc(d.author || 'Unknown channel') + (d.authorVerified ? ' <span class="ch-vbadge">&#10003;</span>' : '');
      chSubs.textContent = (d.subCount != null ? fmtNum(d.subCount) + ' subscribers' : '');
      chDesc.textContent = d.description || '';
      var av = ytChannelThumb(d.authorThumbnails);
      if (av) chAvatar.src = av;
      var bn = '';
      if (d.authorBanners && d.authorBanners.length) {
        for (var bi = d.authorBanners.length - 1; bi >= 0; bi--) {
          if (d.authorBanners[bi].url) { bn = d.authorBanners[bi].url; break; }
        }
      }
      if (bn) { chBanner.src = bn; chBanner.style.display = 'block'; }
      var curl = d.authorUrl || ('https://www.youtube.com/channel/' + authorId);
      chSub.href = curl + '?sub_confirmation=1';
      chSub.style.display = '';
      curChName = d.author || '';
      curChAvatar = av;
      loadChannelVideos(authorId, curChName, av);
    };
    xhr.onerror = function() { setStatus('Channel failed to load'); };
    xhr.ontimeout = function() { setStatus('Channel timed out'); };
    xhr.send();
  }

  function paintChList(html) {
    chList.innerHTML = html;
    bindItems(chList);

  function chSetTab(which) {
    chTabVideos.className = which === 'videos' ? 'on' : '';
    chTabShorts.className = which === 'shorts' ? 'on' : '';
    chTabPlaylists.className = which === 'playlists' ? 'on' : '';
  }

  function bindPlCards(box) {
    var cards = box.querySelectorAll('.pl-card');
    for (var i = 0; i < cards.length; i++) (function(el) {
      if (el._yfb) return;
      el._yfb = 1;
      var sy = 0;
      var moved = false;
      el.addEventListener('touchstart', function(e) {
        sy = e.touches[0].clientY;
        moved = false;
      });
      el.addEventListener('touchmove', function(e) {
        if (Math.abs(e.touches[0].clientY - sy) > 10) moved = true;
      });
      function go(e) {
        e.preventDefault();
        var id = el.getAttribute('data-pl');
        if (id) showPlaylistVideos(id, plTitles[id] || 'Playlist');
      }
      el.addEventListener('click', go);
      el.addEventListener('touchend', function(e) {
        if (moved) return;
        go(e);
      });
    })(cards[i]);

  function loadChannelPlaylists(authorId) {
    chList.innerHTML = '<div class="empty">Loading playlists...</div>';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_CH + '?channelId=' + encodeURIComponent(authorId) + '&tab=playlists', true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) { setStatus('Playlists failed to load'); return; }
      var d;
      try { d = JSON.parse(xhr.responseText); } catch (e) { setStatus('Playlists failed to load'); return; }
      var pls = d.playlists || [];
      if (!pls.length) {
        chList.innerHTML = '<div class="empty">No playlists found</div>';
        setStatus('');
        return;
      }
      var html = '';
      for (var i = 0; i < pls.length; i++) {
        var p = pls[i];
        if (!p.playlistId) continue;
        plTitles[p.playlistId] = p.title || 'Playlist';
        var thumb = p.playlistThumbnail || '';
        if (!thumb && p.videos && p.videos.length && p.videos[0].videoId) thumb = ytThumb(p.videos[0].videoId);
        html += '<div class="pl-card" data-pl="' + esc(p.playlistId) + '">'
          + '<div class="pl-thumb">'
          + (thumb ? '<img src="' + esc(thumb) + '" alt="">' : '')
          + '<div class="cnt">' + (p.videoCount != null ? p.videoCount + ' videos' : 'Playlist') + '</div>'
          + '</div>'
          + '<div><div class="pl-name">' + esc(p.title || 'Untitled') + '</div>'
          + '<div class="pl-open">Open &#8250;</div>'
          + '</div></div>';
      }
      plListHtml = html || '<div class="empty">No playlists found</div>';
      paintChList(plListHtml);
      bindPlCards(chList);
      setStatus('');
    };
    xhr.onerror = function() { setStatus('Playlists failed to load'); };
    xhr.ontimeout = function() { setStatus('Playlists timed out'); };
    xhr.send();
  }

  function showPlaylistVideos(plId, plTitle) {
    chList.innerHTML = '<div class="empty">Loading playlist...</div>';
    window.scrollTo(0, 0);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_CH + '?playlistId=' + encodeURIComponent(plId), true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) { setStatus('Playlist failed to load'); return; }
      var d;
      try { d = JSON.parse(xhr.responseText); } catch (e) { setStatus('Playlist failed to load'); return; }
      var vids = d.videos || [];
      var html = '<a class="ch-back" id="pl-back" href="javascript:void(0)">&larr; Playlists</a>'
        + '<div class="np-title" style="margin-bottom:10px">' + esc(plTitle) + '</div>';
      for (var i = 0; i < vids.length; i++) {
        var v = vids[i];
        if (!v.videoId) continue;
        html += shortItemHtml(v, curChName, curChId, curChAvatar);
      }
      if (!vids.length) html += '<div class="empty">No videos in this playlist</div>';
      paintChList(html);
      setStatus('');
    };
    xhr.onerror = function() { setStatus('Playlist failed to load'); };
    xhr.ontimeout = function() { setStatus('Playlist timed out'); };
    xhr.send();
  }

  chList.addEventListener('click', function(e) {
    var t = e.target;
    while (t && t !== chList) {
      if (t.id === 'pl-back') {
        e.preventDefault();
        if (plListHtml) { paintChList(plListHtml); bindPlCards(chList); }
        chSetTab('playlists');
        return;
      }
      t = t.parentNode;
    }
  });

  function loadUpNext(authorId, authorName) {
    upnextSec.style.display = 'none';
    if (!authorId || IS_LEGACY) return;
    if (upnextCache[authorId]) { paintUpNext(authorId, authorName); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API_CH + '?channelId=' + encodeURIComponent(authorId) + '&tab=videos', true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) return;
      try {
        var d = JSON.parse(xhr.responseText);
        var vids = d.videos || d.latestVideos || [];
        if (!vids.length) return;
        upnextCache[authorId] = vids.slice(0, 12);
        paintUpNext(authorId, authorName);
      } catch (e) {}
    };
    xhr.onerror = function() {};
    xhr.ontimeout = function() {};
    xhr.send();
  }

  function paintUpNext(authorId, authorName) {
    var vids = upnextCache[authorId] || [];
    var html = '';
    var shown = 0;
    for (var i = 0; i < vids.length && shown < 6; i++) {
      var v = vids[i];
      if (!v.videoId || v.videoId === currentVid) continue;
      html += itemHtml({
        vid: v.videoId,
        title: esc(v.title || 'Untitled'),
        author: esc(authorName || v.author || ''),
        authorRaw: authorName || v.author || '',
        authorId: authorId,
        rawViews: v.viewCount || '',
        published: esc(v.publishedText || ''),
        viewsLabel: v.viewCount ? fmtNum(v.viewCount) + ' views' : '',
        durLabel: v.lengthSeconds ? fmtDuration(v.lengthSeconds) : '',
        lenSec: v.lengthSeconds || '',
        vtype: v.type || 'video',
        verified: v.authorVerified,
        thumb: ytThumb(v.videoId),
        avatarUrl: ''
      });
      shown++;

    if (!shown) return;
    upnextList.innerHTML = html;
    bindItems(upnextList);
    upnextFrom.textContent = authorName ? '· ' + authorName : '';

  function doSearch(query) {
    query = (query || '').trim();
    if (!query) return;
    curQuery = query;
    curPage = 1;
    seenIds = {};
    setStatus('Searching...');
    resultsEl.innerHTML = skelHtml();
    loadmoreBtn.style.display = 'none';
    playerBox.style.display = 'none';
    npWrap.style.display = 'none';
    upnextSec.style.display = 'none';
    ytLinkEl.style.display = 'none';
    searchLinksEl.innerHTML = '<a href="javascript:void(0)" onclick="window.open(\'' + YTS + encodeURIComponent(query) + '\',\'_blank\')">Open "' + esc(query) + '" on YouTube &#x2197;</a>';
    fetchSearch(searchUrl(query, 1), function(err, data) {
      if (err) {
        setStatus(err);
        resultsEl.innerHTML = '<div class="empty">Search failed — try again</div>';
        return;

      setStatus('');
      renderResults(data);
      renderRecent();

        if (t.getAttribute('data-ch')) openChannel(t.getAttribute('data-ch'));
        return;
      }
      t = t.parentNode;
    }
  });

  var snapIO = null;

  function snapUnload(slide) {
    var fr = slide.querySelector('iframe');
    if (fr) {
      try { fr.src = ''; } catch (e) {}
      if (fr.parentNode) fr.parentNode.removeChild(fr);
    }
    var im = slide.querySelector('img');
    if (im) im.style.display = '';
    var pb = slide.querySelector('.snap-play');
    if (pb) pb.style.display = '';
    var ld = slide.querySelector('.snap-load');
    if (ld) ld.style.display = 'none';
    slide.removeAttribute('data-loaded');
  }

  function snapLoad(slide) {
    if (!slide || slide.getAttribute('data-loaded')) return;
    var vid = slide.getAttribute('data-vid');
    if (!vid) return;
    slide.setAttribute('data-loaded', '1');
    dbg('snap play');
    var im = slide.querySelector('img');
    if (im) im.style.display = 'none';
    var pb = slide.querySelector('.snap-play');
    if (pb) pb.style.display = 'none';
    var ld = slide.querySelector('.snap-load');
    if (ld) ld.style.display = 'block';
    var fr = document.createElement('iframe');
    fr.setAttribute('webkitallowfullscreen', '');
    fr.setAttribute('allowfullscreen', 'allowfullscreen');
    fr.setAttribute('playsinline', 'playsinline');
    fr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    fr.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    fr.onload = function() {
      var l = slide.querySelector('.snap-load');
      if (l) l.style.display = 'none';
      fr.onload = null;
    };
    fr.src = 'https://www.youtube.com/embed/' + vid + '?autoplay=1&mute=1&rel=0&playsinline=1&controls=1&fs=1&iv_load_policy=3';
    slide.appendChild(fr);
  }

  function snapObserve(feed) {
    if (snapIO) { try { snapIO.disconnect(); } catch (e) {} snapIO = null; }
    if (IS_LEGACY || !('IntersectionObserver' in window)) return;
    snapIO = new IntersectionObserver(function(entries) {
      for (var i = 0; i < entries.length; i++) {
        var s = entries[i].target;
        var r = entries[i].intersectionRatio || 0;
        // Load the centered slide, unload everything else — partial
        // visibility must also stop (old code only unloaded at 0%).
        if (entries[i].isIntersecting && r >= 0.5) snapLoad(s);
        else snapUnload(s);
      }
    }, { root: feed, threshold: [0, 0.25, 0.5, 0.75, 1] });
    var slides = feed.querySelectorAll('.snap-slide');
    for (var j = 0; j < slides.length; j++) snapIO.observe(slides[j]);
  }

  function snapSlideHtml(v, authorName, authorId) {
    return '<div class="snap-slide" data-vid="' + esc(v.videoId) + '"'
      + ' data-title="' + esc(v.title || 'Untitled') + '"'
      + ' data-author="' + esc(authorName || v.author || '') + '"'
      + ' data-authorid="' + esc(authorId || v.authorId || '') + '"'
      + ' data-len="' + (v.lengthSeconds || '') + '"'
      + ' data-type="' + esc(v.type || 'short') + '">'
      + '<img src="' + ytThumb(v.videoId) + '" alt="" onerror="this.style.display=\'none\'">'
      + '<div class="snap-play"></div>'
      + '<div class="snap-load" style="display:none">Loading...</div>'
      + '<div class="snap-cap"><div class="snap-title">' + esc(v.title || 'Untitled') + '</div>'
      + '<div class="snap-author"><span class="chn-link" data-ch="' + esc(authorId || v.authorId || '') + '">' + esc(authorName || v.author || '') + '</span></div>'
      + '</div></div>';
  }

  function snapFindSlide(feed, e) {
    var t = e.target;
    while (t && t !== feed) {
      if (t.className && ('' + t.className).indexOf('snap-slide') !== -1) return t;
      t = t.parentNode;
    }
    return null;
  }

  function buildSnapFeed(box, vids, authorName, authorId) {
    if (snapIO) { try { snapIO.disconnect(); } catch (e) {} snapIO = null; }
    var html = '<div class="snapfeed">';
    var n = 0;
    for (var i = 0; i < vids.length; i++) {
      if (!vids[i].videoId) continue;
      html += snapSlideHtml(vids[i], authorName, authorId);
      n++;
    }
    html += '</div>';
    if (!n) {
      box.innerHTML = '<div class="empty">No shorts found</div>';
      return;
    }
    box.innerHTML = html;
    var feed = box.querySelector('.snapfeed');
    var sy = 0;
    var moved = false;
    feed.addEventListener('touchstart', function(e) {
      sy = e.touches[0].clientY;
      moved = false;
    }, true);
    feed.addEventListener('touchmove', function(e) {
      if (Math.abs(e.touches[0].clientY - sy) > 12) moved = true;
    }, true);
    function onTap(e) {
      if (moved) return;
      var s = snapFindSlide(feed, e);
      if (!s) return;
      var a = e.target;
      while (a && a !== s) {
        if (a.getAttribute && a.getAttribute('data-ch')) {
          e.preventDefault();
          openChannel(a.getAttribute('data-ch'));
          return;
        }
        a = a.parentNode;
      }
      if (IS_LEGACY) {
        e.preventDefault();
        showPreview(s.getAttribute('data-vid'), s.getAttribute('data-title'), s.getAttribute('data-author'), s.getAttribute('data-authorid'), '', s.getAttribute('data-len'), s.getAttribute('data-type'));
        return;
      }
      e.preventDefault();
      snapLoad(s);
    }
    feed.addEventListener('click', onTap);
    feed.addEventListener('touchend', onTap);
    snapObserve(feed);
  }

  function loadMenuShorts() {
    showView('shorts');
    if (shortsLoaded) return;
    shortsFeed.innerHTML = '<div class="empty">Loading shorts...</div>';
    setStatus('Loading shorts...');
    window.scrollTo(0, 0);
    var xhr = new XMLHttpRequest();
    xhr.open('GET', API + '?q=' + encodeURIComponent('#shorts'), true);
    xhr.timeout = 12000;
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) { setStatus('Shorts failed to load'); return; }
      var data;
      try { data = JSON.parse(xhr.responseText); } catch (e) { setStatus('Shorts failed to load'); return; }
      var vids = [];
      for (var i = 0; data && i < data.length; i++) {
        if (data[i].videoId && isShortCtx(data[i].type, data[i].lengthSeconds)) vids.push(data[i]);
      }
      if (!vids.length) {
        shortsFeed.innerHTML = '<div class="empty">No shorts found — try again</div>';
        setStatus('');
        return;
      }
      buildSnapFeed(shortsFeed, vids, '', '');
      shortsLoaded = true;
      shortsLoadedAt = Date.now();
      setStatus('');
    };
    xhr.onerror = function() { setStatus('Shorts failed to load'); };
    xhr.ontimeout = function() { setStatus('Shorts timed out'); };
    xhr.send();
  }

  chDesc.addEventListener('click', function() {
    chDesc.style.maxHeight = chDesc.style.maxHeight === 'none' ? '' : 'none';
  });

  btnSave.addEventListener('click', function() {
    if (!currentVid) return;
    if (isSaved(currentVid)) removeSaved(currentVid);
    else {
      var l = getSaved();
      l.unshift({ id: currentVid, title: npTitle.textContent || '', author: curAuthor, authorId: curAuthorId, lenSec: curLenSec, vtype: curType });
      if (l.length > 100) l.length = 100;
      storeSet('ytf_list', l);
      paintSaveBtn();
      setStatus('Saved.');
    }
  });
  btnShare.addEventListener('click', function() {
    if (!curWatchUrl) return;
    try {
      var ta = document.createElement('textarea');
      ta.value = curWatchUrl;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, 99999);
      if (document.execCommand('copy')) setStatus('Link copied — share it anywhere');
      document.body.removeChild(ta);
    } catch (e) { setStatus('Copy failed'); }
  });
  btnFull.addEventListener('click', function() {
    try {
      if (playerBox.requestFullscreen) playerBox.requestFullscreen();
      else if (playerBox.webkitRequestFullscreen) playerBox.webkitRequestFullscreen();
      else if (playerBox.webkitEnterFullscreen) playerBox.webkitEnterFullscreen();
    } catch (e) {}
  });

  menuHome.addEventListener('click', function() { showView('home'); renderRecent(); });
  menuShorts.addEventListener('click', function() { refreshShorts(); });
  menuSaved.addEventListener('click', function() { showView('saved'); });
  chBack.addEventListener('click', function() { showView('home'); });
  chTabVideos.addEventListener('click', function() {
    chSetTab('videos');
    if (chVideosHtml) paintChList(chVideosHtml);
    else chList.innerHTML = '<div class="empty">Loading videos...</div>';
  });
  chTabShorts.addEventListener('click', function() {
    chSetTab('shorts');
    if (curChId) loadChannelShorts(curChId, curChName, curChAvatar);
  });
  chTabPlaylists.addEventListener('click', function() {
    chSetTab('playlists');
    if (plListHtml) { paintChList(plListHtml); bindPlCards(chList); }
    else if (curChId) loadChannelPlaylists(curChId);
  });

  fSort.addEventListener('change', function() { if (curQuery || qInput.value.trim()) { showView('home'); doSearch(qInput.value.trim() || curQuery); } });
  fDate.addEventListener('change', function() { if (curQuery || qInput.value.trim()) { showView('home'); doSearch(qInput.value.trim() || curQuery); } });
  fDur.addEventListener('change', function() { if (curQuery || qInput.value.trim()) { showView('home'); doSearch(qInput.value.trim() || curQuery); } });
  loadmoreBtn.addEventListener('click', function() { loadMore(); });

  btnSearch.addEventListener('click', function() { showView('home'); doSearch(qInput.value); });
  qInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13 || e.key === 'Enter') { e.preventDefault(); showView('home'); doSearch(qInput.value); }
  });

  var _origDoSearch = doSearch;
  doSearch = function(q) {
    resetPlayer();
    playerBox.style.display = 'none';
    npWrap.style.display = 'none';
    upnextSec.style.display = 'none';
    ytLinkEl.style.display = 'none';
    _origDoSearch(q);
  };

  if (!('ontouchstart' in window)) { try { qInput.focus(); } catch (e) {} }
  renderRecent();
})();
</script>

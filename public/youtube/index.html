<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YT Forge — YouTube Frontend</title>
<link rel="icon" type="image/png" href="../BlockForge.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e6e6f0;font-family:monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 0,rgba(180,40,40,.12) 0,transparent 60%),radial-gradient(ellipse at 70% 100%,rgba(60,60,180,.1) 0,transparent 50%);pointer-events:none}
.wrap{width:min(1000px,96vw);z-index:1;padding:16px 0}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar .logo{font-size:20px;font-weight:bold;color:#fff;white-space:nowrap}
.topbar .logo span{color:#f44}
.back{color:#8af;font:12px monospace;text-decoration:none;white-space:nowrap}
.back:hover{text-decoration:underline}
.search-row{display:flex;margin-bottom:14px}
.search-row input{flex:1;padding:10px 14px;font:14px/1.4 monospace;background:rgba(24,24,48,.85);border:1px solid rgba(120,120,180,.35);border-right:none;border-radius:8px 0 0 8px;color:#fff;outline:none}
.search-row input:focus{border-color:rgba(200,80,80,.6)}
.search-row button{padding:10px 18px;font:14px/1.4 monospace;background:rgba(180,40,40,.8);border:1px solid rgba(180,40,40,.6);border-radius:0 8px 8px 0;color:#fff;cursor:pointer}
.search-row button:hover{background:rgba(220,50,50,.9)}
.status{font-size:11px;color:#888;margin-bottom:10px;min-height:16px}
#player-wrap{position:relative;width:100%;padding-bottom:56.25%;margin-bottom:14px;background:#000;border-radius:10px;overflow:hidden;display:none}
#player-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.now-playing{margin-bottom:16px;display:none}
.np-title{font-size:16px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:6px}
.np-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.np-channel{display:flex;align-items:center;gap:8px}
.np-avatar{width:36px;height:36px;border-radius:50%;background:#222}
.np-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.np-channel-name{font-size:13px;font-weight:bold;color:#ddd}
.np-channel-name .verified{color:#aaa;font-size:11px}
.np-subs{font-size:11px;color:#888}
.np-stats{font-size:11px;color:#888}
.results{display:flex;flex-direction:column;gap:8px}
.result-item{display:flex;gap:12px;padding:8px;background:rgba(20,20,40,.7);border:1px solid rgba(90,90,140,.18);border-radius:8px;cursor:pointer;transition:background .12s}
.result-item:hover{background:rgba(40,40,80,.75);border-color:rgba(140,100,100,.35)}
.r-thumb{width:168px;min-width:168px;height:94px;background:#111;border-radius:6px;overflow:hidden;position:relative;flex-shrink:0}
.r-thumb img{width:100%;height:100%;object-fit:cover}
.r-thumb .dur{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.82);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px}
.r-body{display:flex;gap:10px;min-width:0;flex:1}
.r-avatar{width:36px;height:36px;border-radius:50%;background:#222;flex-shrink:0;overflow:hidden;margin-top:2px}
.r-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.r-info{display:flex;flex-direction:column;min-width:0;flex:1}
.r-title{font-size:13px;font-weight:bold;color:#fff;line-height:1.3;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r-channel{font-size:11px;color:#aaa;line-height:1.3}
.r-channel .vbadge{font-size:9px;background:rgba(255,255,255,.12);padding:0 4px;border-radius:3px;margin-left:3px;color:#ccc}
.r-stats{font-size:11px;color:#777;line-height:1.3}
.empty{text-align:center;padding:40px 0;color:#666;font-size:13px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#555}
@media(max-width:600px){
  .r-thumb{width:120px;min-width:120px;height:68px}
  .r-title{font-size:12px}
  .r-avatar{width:28px;height:28px}
  .np-avatar{width:28px;height:28px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="logo"><span>YT</span> Forge</span>
    <a class="back" href="../games.html?v=2">← Games</a>
  </div>

  <div class="search-row">
    <input id="q" type="text" placeholder="Search YouTube..." autocomplete="off">
    <button id="btn-search">Search</button>
  </div>
  <div class="status" id="status"></div>

  <div id="player-wrap"><iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>
  <div class="now-playing" id="now-playing">
    <div class="np-title" id="np-title"></div>
    <div class="np-meta">
      <div class="np-channel" id="np-channel"></div>
      <div class="np-stats" id="np-stats"></div>
    </div>
  </div>

  <div class="results" id="results">
    <div class="empty">Search for something to get started</div>
  </div>

  <div class="footer">Powered by YouTube · Invidious API · LogicLeague</div>
</div>

<script>
(function(){
  var INSTANCES = [
    'https://invidious.materialio.us',
    'https://yewtu.be',
    'https://invidious.fdn.fr',
    'https://vid.puffyan.us',
    'https://invidious.nerdvpn.de',
    'https://inv.nadeko.net',
    'https://invidious.privacyredirect.com'
  ];
  var apiBase = INSTANCES[0];
  var playerWrap = document.getElementById('player-wrap');
  var playerEl = document.getElementById('player');
  var resultsEl = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var qInput = document.getElementById('q');
  var btnSearch = document.getElementById('btn-search');
  var npWrap = document.getElementById('now-playing');
  var npTitle = document.getElementById('np-title');
  var npChannel = document.getElementById('np-channel');
  var npStats = document.getElementById('np-stats');

  function setStatus(msg) { statusEl.textContent = msg; }

  function esc(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s || ''));
    return d.innerHTML;
  }

  function fmtNum(n) {
    if (n == null) return '';
    n = parseInt(n, 10);
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  function fmtDuration(s) {
    if (!s) return '';
    s = parseInt(s, 10);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function getThumbUrl(thumbs, size) {
    if (!thumbs || !thumbs.length) return '';
    for (var i = 0; i < thumbs.length; i++) {
      if (thumbs[i].width >= size) return thumbs[i].url;
    }
    return thumbs[thumbs.length - 1].url;
  }

  function getAvatarUrl(thumbs) {
    return getThumbUrl(thumbs, 76) || getThumbUrl(thumbs, 48) || '';
  }

  function playVideo(id, title, author, authorId, authorThumbs, viewCount) {
    playerEl.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
    playerWrap.style.display = 'block';
    npTitle.textContent = title || '';

    var avatarUrl = getAvatarUrl(authorThumbs);
    var channelHtml = '';
    if (avatarUrl) channelHtml += '<div class="np-avatar"><img src="' + esc(avatarUrl) + '" alt=""></div>';
    channelHtml += '<div><div class="np-channel-name">' + esc(author || 'Unknown') + '</div>';
    if (authorId) channelHtml += '<div class="np-subs"><a href="https://youtube.com/channel/' + esc(authorId) + '" target="_blank" style="color:#8af;text-decoration:none">Visit channel</a></div>';
    channelHtml += '</div>';
    npChannel.innerHTML = channelHtml;

    var statsHtml = '';
    if (viewCount) statsHtml += fmtNum(viewCount) + ' views';
    npStats.innerHTML = statsHtml;

    npWrap.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderResults(items) {
    if (!items || items.length === 0) {
      resultsEl.innerHTML = '<div class="empty">No results found</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var v = items[i];
      if (v.type !== 'video' && v.type !== 'short') continue;
      var vid = v.videoId;
      if (!vid) continue;
      var title = esc(v.title || 'Untitled');
      var author = esc(v.author || '');
      var authorId = v.authorId || '';
      var published = esc(v.publishedText || '');
      var views = v.viewCount ? fmtNum(v.viewCount) + ' views' : '';
      var length = v.lengthSeconds ? fmtDuration(v.lengthSeconds) : '';
      var verified = v.authorVerified;
      var thumb = getThumbUrl(v.videoThumbnails, 320) || ('https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg');
      var avatarUrl = getAvatarUrl(v.authorThumbnails);

      var metaLine = '';
      if (author) {
        metaLine += '<span class="r-channel">' + author;
        if (verified) metaLine += ' <span class="vbadge">✓</span>';
        metaLine += '</span>';
      }
      if (published) metaLine += '<span class="r-stats"> · ' + published + '</span>';
      if (views) metaLine += '<span class="r-stats"> · ' + views + '</span>';

      html += '<div class="result-item" data-vid="' + esc(vid) + '"'
        + ' data-title="' + esc(v.title || '') + '"'
        + ' data-author="' + esc(v.author || '') + '"'
        + ' data-authorid="' + esc(authorId) + '"'
        + ' data-views="' + (v.viewCount || '') + '"'
        + ' data-avatar="' + esc(avatarUrl) + '"'
        + '>'
        + '<div class="r-thumb">'
        + '<img src="' + thumb + '" alt="" loading="lazy">'
        + (length ? '<span class="dur">' + length + '</span>' : '')
        + '</div>'
        + '<div class="r-body">'
        + (avatarUrl ? '<div class="r-avatar"><img src="' + esc(avatarUrl) + '" alt=""></div>' : '')
        + '<div class="r-info">'
        + '<div class="r-title">' + title + '</div>'
        + metaLine
        + '</div></div></div>';
    }
    if (!html) {
      resultsEl.innerHTML = '<div class="empty">No video results found</div>';
      return;
    }
    resultsEl.innerHTML = html;
    var allItems = resultsEl.querySelectorAll('.result-item');
    for (var j = 0; j < allItems.length; j++) {
      (function(el) {
        function handler(e) {
          e.preventDefault();
          playVideo(
            el.getAttribute('data-vid'),
            el.getAttribute('data-title'),
            el.getAttribute('data-author'),
            el.getAttribute('data-authorid'),
            null,
            el.getAttribute('data-views')
          );
        }
        el.addEventListener('click', handler);
        el.addEventListener('touchend', function(e) {
          e.preventDefault();
          handler(e);
        });
      })(allItems[j]);
    }
  }

  function doSearch(query) {
    query = (query || '').trim();
    if (!query) return;
    setStatus('Searching...');
    resultsEl.innerHTML = '';
    playerWrap.style.display = 'none';
    npWrap.style.display = 'none';

    var tryIdx = 0;
    function tryInstance() {
      if (tryIdx >= INSTANCES.length) {
        setStatus('All search servers failed. Try again later.');
        resultsEl.innerHTML = '<div class="empty">Could not reach any search API.<br>Try again in a moment.</div>';
        return;
      }
      var base = INSTANCES[tryIdx];
      var url = base + '/api/v1/search?q=' + encodeURIComponent(query) + '&type=video';
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.timeout = 8000;
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            var data = JSON.parse(xhr.responseText);
            if (data && data.length > 0) {
              apiBase = base;
              setStatus('');
              renderResults(data);
            } else {
              tryIdx++;
              tryInstance();
            }
          } catch(e) {
            tryIdx++;
            tryInstance();
          }
        } else {
          tryIdx++;
          tryInstance();
        }
      };
      xhr.onerror = function() {
        tryIdx++;
        tryInstance();
      };
      xhr.ontimeout = function() {
        tryIdx++;
        tryInstance();
      };
      xhr.send();
    }
    tryInstance();
  }

  btnSearch.addEventListener('click', function() { doSearch(qInput.value); });
  qInput.addEventListener('keydown', function(e) {
    if (e.keyCode === 13 || e.key === 'Enter') {
      e.preventDefault();
      doSearch(qInput.value);
    }
  });

  qInput.focus();
})();
</script>
</body>
</html>

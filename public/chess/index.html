<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BlockChess — 3D Chess vs 10 Bots</title>
<link rel="icon" type="image/png" href="../BlockForge.png">
<!--
  BlockChess vendored libraries:
  - three.js r128 (MIT License, Copyright (c) 2010-2021 Three.js authors)
  - OrbitControls.js r128 (same MIT license)
  - chess.js 0.10.3 (BSD-2-Clause, Copyright (c) 2019 Jeff Hlywa)
-->
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/chess.min.js"></script>
<script src="ai.js"></script>
<script src="game3d.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d18;color:#e8e8f2;font-family:monospace;min-height:100vh;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 0,rgba(180,150,90,.10) 0,transparent 55%),radial-gradient(ellipse at 50% 100%,rgba(60,60,180,.10) 0,transparent 50%);pointer-events:none}
.wrap{width:96vw;max-width:1000px;z-index:1;padding:14px 0 30px}
.topbar{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;margin-bottom:10px}
.logo{font-size:22px;font-weight:bold;color:#fff;letter-spacing:1px;text-shadow:0 0 18px rgba(220,180,90,.35)}
.logo span{color:#ec5}
.back{color:#cfe0ff;font-size:12px;text-decoration:none;background:rgba(60,70,120,.35);border:1px solid rgba(120,140,220,.35);border-radius:20px;padding:6px 14px;white-space:nowrap}
.back:active{background:rgba(80,95,160,.6)}
.controls{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:8px}
.controls .ctl{margin:0 8px 8px 0;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.controls label{font-size:11px;color:#888;margin-right:6px}
.controls select{padding:9px 8px;font:12px monospace;background:rgba(20,20,40,.9);border:1px solid rgba(120,120,180,.35);border-radius:8px;color:#ddd;outline:none;max-width:170px}
.controls button{padding:9px 12px;margin:0 8px 8px 0;font:bold 12px monospace;background:rgba(50,55,100,.55);border:1px solid rgba(120,140,220,.35);border-radius:8px;color:#dfe6ff;cursor:pointer}
.controls button:active{background:rgba(80,95,160,.8)}
#leveldesc{font-size:11px;color:#888;margin:-2px 0 10px}
#status{font-size:13px;color:#fc3;min-height:20px;margin-bottom:8px;text-align:center}
.main{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.boardcol{-webkit-flex:1 1 420px;flex:1 1 420px;min-width:280px}
#board{position:relative;width:100%;padding-bottom:100%;background:#000;border:1px solid rgba(200,170,100,.35);border-radius:12px;overflow:hidden}
#board canvas{position:absolute;top:0;left:0;width:100% !important;height:100% !important}
.sidecol{-webkit-flex:1 1 220px;flex:1 1 220px;min-width:220px;margin-left:12px}
#clocks{display:-webkit-box;display:-webkit-flex;display:flex;margin-bottom:8px}
#clocks div{-webkit-flex:1;flex:1;text-align:center;font:bold 15px monospace;background:rgba(20,20,40,.8);border:1px solid rgba(120,120,180,.3);border-radius:8px;padding:8px}
#clocks div:first-child{margin-right:8px}
.panel{background:rgba(20,20,40,.55);border:1px solid rgba(90,90,140,.2);border-radius:10px;padding:10px;margin-bottom:8px}
.panel h3{font-size:12px;color:#888;margin-bottom:6px;letter-spacing:1px}
#movelist{max-height:150px;overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:12px;line-height:1.7}
.mv-row{color:#ccc}
#captured{font-size:11px;color:#aaa;line-height:1.6;word-break:break-all}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:60;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px}
.modal .box{background:#191926;border:2px solid rgba(220,180,90,.4);border-radius:12px;padding:22px;text-align:center;max-width:380px;width:100%}
.modal h2{font-size:20px;color:#fff;margin-bottom:10px}
.modal p{font-size:13px;color:#ccc;line-height:1.6;margin-bottom:16px;white-space:pre-wrap}
.modal button{display:block;width:100%;padding:12px;margin-bottom:8px;font:bold 14px monospace;background:rgba(60,60,110,.7);border:1px solid rgba(140,150,230,.4);border-radius:8px;color:#fff;cursor:pointer}
.modal button:active{background:rgba(90,100,170,.9)}
.prow{display:-webkit-box;display:-webkit-flex;display:flex}
.prow button{font-size:26px;-webkit-flex:1;flex:1;margin-right:8px}
.prow button:last-child{margin-right:0}
.footer{text-align:center;margin-top:14px;font-size:11px;color:#555}
@media(max-width:700px){
  .sidecol{margin-left:0;margin-top:10px}
  .logo{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="logo"><span>Block</span>Chess</span>
    <a class="back" href="../games.html">Games</a>
  </div>

  <div class="controls">
    <span class="ctl"><label>Bot</label><select id="level"></select></span>
    <span class="ctl"><label>Play</label><select id="color">
      <option value="w">White</option>
      <option value="b">Black</option>
    </select></span>
    <span class="ctl"><label>Clock</label><select id="clocksel">
      <option value="0">None</option>
      <option value="300000">5 min</option>
      <option value="600000">10 min</option>
      <option value="900000">15 min</option>
    </select></span>
    <button id="btn-new">New</button>
    <button id="btn-flip">Flip</button>
    <button id="btn-undo">Undo</button>
    <button id="btn-hint">Hint</button>
    <button id="btn-resign">Resign</button>
  </div>
  <div id="leveldesc"></div>
  <div id="status">Loading…</div>

  <div class="main">
    <div class="boardcol"><div id="board"></div></div>
    <div class="sidecol">
      <div id="clocks" style="display:none">
        <div id="clock-you">YOU</div>
        <div id="clock-bot">BOT</div>
      </div>
      <div class="panel"><h3>MOVES</h3><div id="movelist"></div></div>
      <div class="panel"><h3>CAPTURED</h3><div id="captured"></div></div>
    </div>
  </div>

  <div class="modal" id="promo">
    <div class="box">
      <h2>Promote to</h2>
      <div class="prow">
        <button>♛ Q</button><button>♜ R</button><button>♝ B</button><button>♞ N</button>
      </div>
    </div>
  </div>

  <div class="modal" id="result">
    <div class="box">
      <h2 id="res-title"></h2>
      <p id="res-sub"></p>
      <button id="btn-again">Play again</button>
    </div>
  </div>

  <div class="footer">BlockChess &middot; 10 bots from pushover to nightmare &middot; LogicLeague</div>
</div>
<script src="app.js"></script>
<script>ChessApp.boot();</script>
</body>
</html>

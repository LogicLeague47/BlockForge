# BlockForge game host (Fly.io). See docs/BACKEND_SPLIT.md.
app = 'blockforge-ws'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  BF_ROLE = 'ws'
  UPSTREAM_BACKEND_URL = 'wss://blockforge-social.fly.dev'
  BAN_SYNC_URL = 'https://blockforge-server.onrender.com/api/global-bans'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '30s'
  interval = '30s'
  method = 'GET'
  path = '/health'
  timeout = '5s'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
